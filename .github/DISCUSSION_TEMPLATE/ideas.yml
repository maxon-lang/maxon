body:
  - type: markdown
    attributes:
      value: >-
        One idea per discussion — a new feature, or a change to something that exists. Search first:
        if the idea is already here, upvote it and add your case in a comment rather than opening a
        second one. The most-upvoted ideas are the ones the project looks at first.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Language
        - Standard library
        - Compiler and CLI
        - Editor tooling
        - Documentation and website
        - Something else
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: >-
        The problem, before the solution. An idea is easier to judge — and often easier to grant a
        different way — when the thing it is for is written down.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: What it might look like
      description: Maxon code as you would want to write it, if you have a shape in mind.
      render: maxon
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: What you do instead today
      description: >-
        How you work around it now, and what that costs. A workaround that is merely verbose is a
        different case from one that is impossible.
    validations:
      required: false
