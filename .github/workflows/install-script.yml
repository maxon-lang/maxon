# Run `website/public/install.sh` and `website/public/install.ps1` the way a user does, on every
# platform they serve, against the latest published release.
#
# ⭐ THE SCRIPTS ARE WHAT A NEW USER RUNS FIRST, AND NOTHING ELSE EXERCISES THEM. They are served as
# static files, so a broken one ships with the next website deploy and is found by the first person
# who tries it. `release.yml`'s `publish` job starts this once a release is live, so a release that a
# script cannot install is found by CI rather than by a user.
#
# ⚠ install.sh IS FED ON STDIN, AS `curl … | sh` FEEDS IT, and run by each runner's own `/bin/sh` —
# dash on Ubuntu, bash in POSIX mode on macOS — so a bashism fails here rather than on someone's
# machine. install.ps1 runs under both Windows PowerShell 5.1 and PowerShell 7, the two a user may have.

name: install-script

on:
  push:
    branches: [main]
    paths: &installer-inputs ['website/public/install.sh', 'website/public/install.ps1', 'website/public/_headers', '.github/workflows/install-script.yml', 'maxon-bin/targets.tsv', 'scripts/targets/matrix.sh', 'scripts/lib/host-binaries.sh']
  pull_request:
    paths: *installer-inputs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck --shell=sh website/public/install.sh

  lint-ps1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Windows PowerShell 5.1's `irm` decodes a response without a charset as ISO-8859-1, so one
      # non-ASCII byte can become a quote character that ends a string early.
      - name: install.ps1 is ASCII, and Windows PowerShell 5.1 parses it
        shell: powershell
        run: |
          $path = (Resolve-Path website/public/install.ps1).Path
          $high = @([IO.File]::ReadAllBytes($path) | Where-Object { $_ -gt 127 }).Count
          if ($high -ne 0) { throw "install.ps1 holds $high non-ASCII bytes" }
          $errors = $null
          $null = [Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors)
          if ($errors.Count -ne 0) { $errors; throw 'install.ps1 does not parse' }

      # Write-Host is how the script talks to a person without writing to the pipeline of the session it
      # runs in, and $global:LASTEXITCODE is how it reports a status without `exit`.
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $findings = Invoke-ScriptAnalyzer -Path website/public/install.ps1 -Severity Warning, Error -ExcludeRule PSAvoidUsingWriteHost, PSAvoidGlobalVars
          $findings | Format-Table -AutoSize -Wrap
          if ($findings) { throw "PSScriptAnalyzer reported $(@($findings).Count) findings" }

  targets:
    runs-on: ubuntu-latest
    outputs:
      unix: ${{ steps.matrix.outputs.unix }}
      windows: ${{ steps.matrix.outputs.windows }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            maxon-bin/targets.tsv
            scripts/lib/host-binaries.sh
            scripts/targets/matrix.sh
          sparse-checkout-cone-mode: false

      - name: Read the installable targets from the table
        id: matrix
        run: |
          unix="$(./scripts/targets/matrix.sh json channels=install-sh)"
          windows="$(./scripts/targets/matrix.sh json --with edition=powershell,pwsh channels=install-ps1)"
          {
            echo "unix=$unix"
            echo "windows=$windows"
          } >> "$GITHUB_OUTPUT"

  install:
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.unix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      # The install and the new shell get the system directories only, so `maxon` is found through the
      # profile line or not at all.
      SYSTEM_PATH: /usr/bin:/bin:/usr/sbin:/sbin
      # The first release that has `maxon upgrade`, so the oldest install one can move forward.
      FIRST_UPGRADE_RELEASE: 0.2.0
      RELEASE_HELPERS_SH: |
        release_version() {
          local tag
          tag="$(gh release view --json tagName --jq .tagName)" || return 1
          printf '%s\n' "${tag#v}"
        }
        release_download() {
          gh release download "v$2" --pattern "$3" --dir "$1"
        }
        release_download_asset() {
          asset="maxon-$2-$3.$4"
          release_download "$1" "$2" "$asset"
        }
        mirror_stage() {
          version="$(release_version)"
          mirror="$(mktemp -d)"
          release_dir="$mirror/v$version"
          mkdir -p "$release_dir"
          release_download_asset "$release_dir" "$version" "$1" "$2"
        }
        mirror_stop() {
          kill "$mirror_server" 2> /dev/null || true
          wait "$mirror_server" 2> /dev/null || true
        }
        mirror_start() {
          mirror_url="http://127.0.0.1:$1"
          mirror_requests="$mirror/requests.log"
          python3 -u -m http.server "$1" --bind 127.0.0.1 --directory "$mirror" > /dev/null 2> "$mirror_requests" &
          mirror_server=$!
          for _ in $(seq 1 50); do
            kill -0 "$mirror_server" 2> /dev/null || break
            if curl -fsS -o /dev/null "$mirror_url/" 2> /dev/null; then
              return 0
            fi
            sleep 0.2
          done
          mirror_stop
          echo "::error::the mirror never came up"
          return 1
        }
    steps:
      - uses: actions/checkout@v5

      - name: Install, as `curl | sh` would
        run: |
          set -euo pipefail
          env PATH="$SYSTEM_PATH" SHELL="$(command -v ${{ matrix.shell }})" sh < website/public/install.sh

      - name: The installed compiler is the latest release
        run: |
          set -euo pipefail
          eval "$RELEASE_HELPERS_SH"
          latest="$(release_version)"
          reported="$("$HOME/.maxon/bin/maxon" version)"
          echo "$reported"
          case "$reported" in
            "maxon $latest "*) ;;
            *) echo "::error::expected $latest, the latest release"; exit 1 ;;
          esac

      # ⛔ EVERY DIRECTORY THE ARCHIVE SHIPS MUST LAND BESIDE THE COMPILER. `stdlib/` and its sibling
      # `runtime/` are resolved by walking UP from the executable, so one left behind by the install is a
      # compiler that cannot compile. The archive is asked for the set rather than a list kept here, which
      # would go stale the next time a tier is added.
      - name: Every directory in the archive is installed beside the compiler
        run: |
          set -euo pipefail
          eval "$RELEASE_HELPERS_SH"
          latest="$(release_version)"
          work="$(mktemp -d)"
          release_download_asset "$work" "$latest" "${{ matrix.target }}" "${{ matrix.archive }}"
          tar -tzf "$work"/maxon-*.tar.gz | awk -F/ 'NF >= 3 && $3 != "" { print $2 }' | sort -u > "$work/dirs"
          cat "$work/dirs"
          [ -s "$work/dirs" ] || { echo "::error::the archive holds no directories at all"; exit 1; }
          while read -r dir; do
            [ -d "$HOME/.maxon/$dir" ] || { echo "::error::$dir/ is in the archive but not in the install"; exit 1; }
          done < "$work/dirs"

      # A new terminal is where the user meets the PATH edit, so the check runs in a new interactive
      # shell of the kind the profile was written for.
      - name: A new ${{ matrix.shell }} finds `maxon` by name
        run: env -i HOME="$HOME" TERM=dumb PATH="$SYSTEM_PATH" "$(command -v ${{ matrix.shell }})" -ic 'command -v maxon && maxon version'

      # The compiler finds stdlib/ by walking up from its own executable; from a directory with no
      # checkout above it, this is the case a user is in.
      - name: It compiles and runs a program outside any checkout
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp "$HOME/.maxon/examples/hello.maxon" "$work/"
          cd "$work"
          "$HOME/.maxon/bin/maxon" build hello.maxon --output=hello
          [ "$(./hello)" = "Hello, world!" ]

      - name: A download is not quarantined, so Gatekeeper does not stop it
        if: runner.os == 'macOS'
        run: |
          if xattr -p com.apple.quarantine "$HOME/.maxon/bin/maxon" 2>/dev/null; then
            echo "::error::the installed compiler carries com.apple.quarantine"
            exit 1
          fi

      - name: Running it again says the install is current and writes the profile line once
        run: |
          set -euo pipefail
          out="$(env PATH="$SYSTEM_PATH" SHELL="$(command -v ${{ matrix.shell }})" sh < website/public/install.sh)"
          echo "$out"
          case "$out" in
            *"already installed"*) ;;
            *) echo "::error::a rerun did not report the install as current"; exit 1 ;;
          esac
          case "${{ matrix.shell }}" in
            zsh)  profile="$HOME/.zshrc" ;;
            bash) profile="$HOME/.bashrc" ;;
          esac
          count="$(grep -c 'Added by the Maxon installer' "$profile")"
          [ "$count" = 1 ] || { echo "::error::$profile has $count installer lines"; exit 1; }

      # `curl | sh` cannot reach its caller's PATH, so a personal bin directory the caller's PATH already
      # holds is the only place `maxon` becomes runnable in that terminal at once. The compile goes
      # through the link, because stdlib/ is found by walking up from the RESOLVED executable.
      - name: With ~/.local/bin on PATH, `maxon` is linked there and runs at once
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          mkdir -p "$home/.local/bin"
          caller_path="$home/.local/bin:$SYSTEM_PATH"
          env HOME="$home" PATH="$caller_path" SHELL="$(command -v ${{ matrix.shell }})" sh < website/public/install.sh
          [ "$(readlink "$home/.local/bin/maxon")" = "$home/.maxon/bin/maxon" ] || { echo "::error::no link to the install in ~/.local/bin"; exit 1; }
          if grep -qs 'Added by the Maxon installer' "$home/.zshrc" "$home/.bashrc"; then
            echo "::error::a shell profile was edited although the link already puts maxon on PATH"
            exit 1
          fi
          found="$(env PATH="$caller_path" sh -c 'command -v maxon')"
          [ "$found" = "$home/.local/bin/maxon" ] || { echo "::error::the caller's PATH finds '$found'"; exit 1; }
          work="$(mktemp -d)"
          cp "$home/.maxon/examples/hello.maxon" "$work/"
          (cd "$work" && env PATH="$caller_path" maxon build hello.maxon --output=hello)
          [ "$("$work/hello")" = "Hello, world!" ]
          # `maxon upgrade`'s shape: --no-modify-path over an install the link already puts on PATH.
          out="$(env HOME="$home" PATH="$caller_path" sh -s -- --no-modify-path < website/public/install.sh)"
          echo "$out"
          case "$out" in
            *"not on your PATH"*) echo "::error::--no-modify-path calls a linked install not on PATH"; exit 1 ;;
          esac

      - name: A `maxon` in ~/.local/bin that is not the install's is left alone
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          mkdir -p "$home/.local/bin"
          printf '#!/bin/sh\necho foreign\n' > "$home/.local/bin/maxon"
          chmod +x "$home/.local/bin/maxon"
          env HOME="$home" PATH="$home/.local/bin:$SYSTEM_PATH" SHELL="$(command -v ${{ matrix.shell }})" sh < website/public/install.sh
          if [ -L "$home/.local/bin/maxon" ] || ! grep -q foreign "$home/.local/bin/maxon"; then
            echo "::error::the foreign maxon was replaced"
            exit 1
          fi
          grep -qs 'Added by the Maxon installer' "$home/.zshrc" "$home/.bashrc" || { echo "::error::no shell profile line, so nothing puts the install on PATH"; exit 1; }

      # `maxon upgrade` runs the PUBLISHED script against its own install, so this is the contract between
      # every shipped compiler and whatever maxon.dev serves now. A release older than the command skips it.
      - name: maxon upgrade finds the install current
        run: |
          set -euo pipefail
          maxon="$HOME/.maxon/bin/maxon"
          if ! "$maxon" help upgrade > /dev/null 2>&1; then
            echo "::notice::the latest release has no maxon upgrade yet"
            exit 0
          fi
          "$maxon" upgrade --dry-run
          out="$(env PATH="$SYSTEM_PATH" "$maxon" upgrade 2>&1)"
          echo "$out"
          case "$out" in
            *"already installed"*) ;;
            *) echo "::error::maxon upgrade did not find the install current"; exit 1 ;;
          esac

      # ⭐ AN UPGRADE THAT MOVES THE INSTALL, run by name through the ~/.local/bin link: the compiler finds
      # its install from the RESOLVED executable, so the link must not hide the root from it, and must
      # still reach the new compiler once the old one has been replaced.
      - name: maxon upgrade, run through the link, moves an older install to the latest release
        run: |
          set -euo pipefail
          eval "$RELEASE_HELPERS_SH"
          latest="$(release_version)"
          if [ "$latest" = "$FIRST_UPGRADE_RELEASE" ]; then
            echo "::notice::the latest release is the first with maxon upgrade, so there is nothing older to upgrade"
            exit 0
          fi
          home="$(mktemp -d)"
          mkdir -p "$home/.local/bin"
          caller_path="$home/.local/bin:$SYSTEM_PATH"
          env HOME="$home" PATH="$caller_path" SHELL="$(command -v ${{ matrix.shell }})" sh -s -- --version "$FIRST_UPGRADE_RELEASE" < website/public/install.sh
          [ -L "$home/.local/bin/maxon" ] || { echo "::error::the install made no link to upgrade through"; exit 1; }
          case "$(env PATH="$caller_path" maxon version)" in
            "maxon $FIRST_UPGRADE_RELEASE "*) ;;
            *) echo "::error::the older install does not report $FIRST_UPGRADE_RELEASE"; exit 1 ;;
          esac

          # The dry run names the physical root, which a symlinked temp directory (macOS's /var) resolves.
          root="$(cd "$home/.maxon" && pwd -P)"
          plan="$(env HOME="$home" PATH="$caller_path" maxon upgrade --dry-run)"
          echo "$plan"
          case "$plan" in
            *"install root: $root"*) ;;
            *) echo "::error::upgrade through the link does not name the install at $root"; exit 1 ;;
          esac

          env HOME="$home" PATH="$caller_path" maxon upgrade
          reported="$(env PATH="$caller_path" maxon version)"
          echo "$reported"
          case "$reported" in
            "maxon $latest "*) ;;
            *) echo "::error::after maxon upgrade the link runs '$reported', not $latest"; exit 1 ;;
          esac
          out="$(env HOME="$home" PATH="$caller_path" maxon upgrade 2>&1)"
          echo "$out"
          case "$out" in
            *"already installed"*) ;;
            *) echo "::error::a second maxon upgrade did not find the install current"; exit 1 ;;
          esac
          leftovers="$(find "$home/.maxon" -mindepth 1 -maxdepth 1 -name '.*')"
          [ -z "$leftovers" ] || { echo "::error::the upgrade left behind: $leftovers"; exit 1; }

      - name: A specific version installs, and --force reinstalls the latest over it
        run: |
          set -euo pipefail
          eval "$RELEASE_HELPERS_SH"
          latest="$(release_version)"
          env PATH="$SYSTEM_PATH" sh -s -- --version 0.1.0 --no-modify-path < website/public/install.sh
          case "$("$HOME/.maxon/bin/maxon" version 2>/dev/null || true)" in
            "maxon $latest "*) echo "::error::--version 0.1.0 left the latest release in place"; exit 1 ;;
          esac
          env PATH="$SYSTEM_PATH" sh -s -- --force --no-modify-path < website/public/install.sh
          case "$("$HOME/.maxon/bin/maxon" version)" in
            "maxon $latest "*) ;;
            *) echo "::error::--force did not install the latest release"; exit 1 ;;
          esac
          leftovers="$(find "$HOME/.maxon" -mindepth 1 -maxdepth 1 -name '.*')"
          [ -z "$leftovers" ] || { echo "::error::left behind: $leftovers"; exit 1; }

      - name: A scriptlib package the new compiler rejects is reported, and the install still succeeds
        run: |
          set -euo pipefail
          custom="$(mktemp -d)/maxon"
          MAXON_INSTALL="$custom" sh -s -- --no-modify-path < website/public/install.sh
          if ! "$custom/bin/maxon" help check-scriptlib > /dev/null 2>&1; then
            echo "::notice::the latest release has no maxon check-scriptlib yet"
            exit 0
          fi
          package="$custom/scriptlib/broken"
          mkdir -p "$package"
          {
            printf '%s\n' 'public function broken() returns Count'
            printf '\t%s\n' 'return "not a count"'
            printf '%s\n' "end 'broken'"
          } > "$package/Broken.maxon"
          out="$(MAXON_INSTALL="$custom" sh -s -- --force --no-modify-path < website/public/install.sh 2>&1)"
          echo "$out"
          case "$out" in
            *"scriptlib needs updating"*) ;;
            *) echo "::error::an install over a scriptlib package the compiler rejects printed no notice"; exit 1 ;;
          esac
          case "$out" in
            *Broken.maxon*) ;;
            *) echo "::error::the notice did not carry the compiler's diagnostics"; exit 1 ;;
          esac
          [ -f "$package/Broken.maxon" ] || { echo "::error::the install removed the user's scriptlib package"; exit 1; }
          "$custom/bin/maxon" version

      - name: MAXON_INSTALL puts the install anywhere, and refuses a directory that is not one
        run: |
          set -euo pipefail
          custom="$(mktemp -d)/maxon"
          MAXON_INSTALL="$custom" sh -s -- --no-modify-path < website/public/install.sh
          "$custom/bin/maxon" version
          snapshot() { (cd "$1" && find . | sort && find . -type f -exec cksum {} + | sort); }
          entries="$(sed -n 's/^[[:space:]]*install_entries="\([^"]*\)"[[:space:]]*$/\1/p' website/public/install.sh)"
          [ "$(printf '%s\n' "$entries" | wc -l)" -eq 1 ] && [ -n "$entries" ] || { echo "::error::install.sh has no single install_entries=\"…\" assignment"; exit 1; }
          for entry in $entries; do
            foreign="$(mktemp -d)"
            mkdir "$foreign/$entry"
            printf 'not ours\n' > "$foreign/$entry/keep"
            before="$(snapshot "$foreign")"
            status=0
            out="$(MAXON_INSTALL="$foreign" sh -s -- --no-modify-path < website/public/install.sh 2>&1)" || status=$?
            echo "$out"
            [ "$status" -eq 1 ] || { echo "::error::a directory with its own $entry/ exited $status, not 1"; exit 1; }
            case "$out" in
              *"$entry exists and "*"holds no bin/maxon"*) ;;
              *) echo "::error::the refusal over its own $entry/ did not say why"; exit 1 ;;
            esac
            [ "$(snapshot "$foreign")" = "$before" ] || { echo "::error::the foreign $entry/ was touched"; exit 1; }
          done

      # ⛔ THE REFUSAL IS THE SCRIPT'S ONE SECURITY CLAIM, SO IT IS MADE TO FIRE. The real archive is
      # served from a mirror whose SHA256SUMS names another hash; the install must refuse and leave the
      # existing one in place.
      - name: A checksum mismatch installs nothing
        run: |
          set -euo pipefail
          eval "$RELEASE_HELPERS_SH"
          mirror_stage "${{ matrix.target }}" "${{ matrix.archive }}"
          printf '%064d  %s\n' 0 "$asset" > "$release_dir/SHA256SUMS"
          before="$(cksum < "$HOME/.maxon/bin/maxon")"
          if MAXON_DOWNLOAD_BASE="file://$mirror" sh -s -- --version "$version" --force < website/public/install.sh; then
            echo "::error::a tampered SHA256SUMS was accepted"
            exit 1
          fi
          after="$(cksum < "$HOME/.maxon/bin/maxon")"
          [ "$before" = "$after" ] || { echo "::error::the failed install changed the existing one"; exit 1; }

      - name: A release whose SHA256SUMS lists no build for this machine installs nothing and downloads no archive
        run: |
          set -euo pipefail
          eval "$RELEASE_HELPERS_SH"
          mirror_stage "${{ matrix.target }}" "${{ matrix.archive }}"
          release_download "$release_dir" "$version" SHA256SUMS
          { grep -vF -- "$asset" "$release_dir/SHA256SUMS" || [ "$?" -eq 1 ]; } > "$mirror/unlisted"
          mv "$mirror/unlisted" "$release_dir/SHA256SUMS"
          [ -s "$release_dir/SHA256SUMS" ] || { echo "::error::the release lists no other build, so the mirror proves nothing"; exit 1; }
          mirror_start 8765
          before="$(cksum < "$HOME/.maxon/bin/maxon")"
          status=0
          out="$(MAXON_DOWNLOAD_BASE="$mirror_url" sh -s -- --version "$version" --force < website/public/install.sh 2>&1)" || status=$?
          mirror_stop
          echo "$out"
          [ "$status" -ne 0 ] || { echo "::error::an install with no listed build succeeded"; exit 1; }
          case "$out" in
            *"Maxon v$version has no build for ${{ matrix.target }}"*) ;;
            *) echo "::error::the refusal did not say that v$version has no build for ${{ matrix.target }}"; exit 1 ;;
          esac
          grep -qF "/v$version/SHA256SUMS" "$mirror_requests" || { echo "::error::the installer never read SHA256SUMS"; exit 1; }
          if grep -qF "$asset" "$mirror_requests"; then
            echo "::error::the installer asked the mirror for $asset"
            exit 1
          fi
          after="$(cksum < "$HOME/.maxon/bin/maxon")"
          [ "$before" = "$after" ] || { echo "::error::the refused install changed the existing one"; exit 1; }

  windows:
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.windows) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.edition }}
    env:
      GH_TOKEN: ${{ github.token }}
      # The first release that has `maxon upgrade`, so the oldest install one can move forward.
      FIRST_UPGRADE_RELEASE: 0.2.0
      RELEASE_HELPERS_PS: |
        function Get-ReleaseVersion {
          $tag = gh release view --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0) { throw 'gh could not read the latest release' }
          $tag.TrimStart('v')
        }
        function Save-ReleaseFile([string]$Dir, [string]$Version, [string]$Pattern) {
          $null = gh release download "v$Version" --pattern $Pattern --dir $Dir
          if ($LASTEXITCODE -ne 0) { throw "gh could not download $Pattern from v$Version" }
        }
        function Save-ReleaseAsset([string]$Dir, [string]$Version, [string]$Target, [string]$Archive) {
          $asset = "maxon-$Version-$Target.$Archive"
          Save-ReleaseFile $Dir $Version $asset
          $asset
        }
        function New-Mirror([string]$Name, [string]$Target, [string]$Archive) {
          $version = Get-ReleaseVersion
          $root = Join-Path $env:RUNNER_TEMP $Name
          $dir = (New-Item -ItemType Directory -Force -Path "$root\v$version").FullName
          $asset = Save-ReleaseAsset $dir $version $Target $Archive
          [pscustomobject]@{ Version = $version; Asset = $asset; Root = $root; Dir = $dir }
        }
        function Stop-Mirror($Server) {
          Stop-Process -Id $Server.Id -ErrorAction SilentlyContinue
          $Server.WaitForExit()
        }
        function Start-Mirror([string]$Root, [int]$Port) {
          $requests = "$Root.log"
          $url = "http://127.0.0.1:$Port"
          $server = Start-Process python -ArgumentList '-u', '-m', 'http.server', "$Port", '--bind', '127.0.0.1', '--directory', $Root -PassThru -WindowStyle Hidden -RedirectStandardError $requests
          foreach ($attempt in 1..50) {
            if ($server.HasExited) { break }
            try {
              $null = Invoke-WebRequest -UseBasicParsing -Uri "$url/" -TimeoutSec 2
              return [pscustomobject]@{ Server = $server; Url = $url; Requests = $requests }
            } catch {
              Start-Sleep -Milliseconds 200
            }
          }
          Stop-Mirror $server
          throw 'the mirror never came up'
        }
    # ⚠ THE RUNNER'S SHELL WRAPPER EXITS WITH $LASTEXITCODE, so a step that expects the script to fail
    # resets it before it ends.
    steps:
      - uses: actions/checkout@v5

      # An entry the install must neither expand nor lose, in a value it must not flatten to REG_SZ.
      - name: Seed the user PATH with an expandable entry
        run: |
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $true)
          $current = $key.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          $key.SetValue('Path', ($current.TrimEnd(';') + ';%USERPROFILE%\seeded').TrimStart(';'), 'ExpandString')
          $key.Close()

      - name: Install, as `irm | iex` would
        run: |
          Get-Content -Raw website/public/install.ps1 | Invoke-Expression
          if ($LASTEXITCODE -ne 0) { throw "the install failed ($LASTEXITCODE)" }
          if (Get-Command Install-Maxon -ErrorAction SilentlyContinue) { throw 'the script left Install-Maxon defined in the session' }
          $found = (Get-Command maxon -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          if ($found -ine "$HOME\.maxon\bin\maxon.exe") { throw "the session that ran the install finds '$found', not the install" }

      - name: The installed compiler is the latest release
        run: |
          . ([scriptblock]::Create($env:RELEASE_HELPERS_PS))
          $latest = Get-ReleaseVersion
          $reported = & "$HOME\.maxon\bin\maxon.exe" version
          $reported
          if ($reported -notlike "maxon $latest *") { throw "expected $latest, the latest release" }

      # ⛔ EVERY DIRECTORY THE ARCHIVE SHIPS MUST LAND BESIDE THE COMPILER. `stdlib\` and its sibling
      # `runtime\` are resolved by walking UP from the executable, so one left behind by the install is a
      # compiler that cannot compile. The archive is asked for the set rather than a list kept here, which
      # would go stale the next time a tier is added.
      - name: Every directory in the archive is installed beside the compiler
        run: |
          . ([scriptblock]::Create($env:RELEASE_HELPERS_PS))
          $latest = Get-ReleaseVersion
          $work = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'shape')
          $null = Save-ReleaseAsset $work $latest '${{ matrix.target }}' '${{ matrix.archive }}'
          $zip = (Get-ChildItem -LiteralPath $work -Filter *.zip)[0].FullName
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $dirs = @($archive.Entries.FullName |
              Where-Object { ($_ -split '/').Count -ge 3 -and ($_ -split '/')[2] -ne '' } |
              ForEach-Object { ($_ -split '/')[1] } | Sort-Object -Unique)
          } finally {
            $archive.Dispose()
          }
          $dirs
          if ($dirs.Count -eq 0) { throw 'the archive holds no directories at all' }
          foreach ($dir in $dirs) {
            if (-not (Test-Path -LiteralPath "$HOME\.maxon\$dir" -PathType Container)) { throw "$dir\ is in the archive but not in the install" }
          }

      - name: A new terminal finds `maxon`, and the user PATH kept its kind and its entries
        run: |
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $kind = $key.GetValueKind('Path')
          $raw = $key.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          $key.Close()
          "kind: $kind"
          "raw:  $raw"
          if ($kind -ne 'ExpandString') { throw "the user Path is $kind, not ExpandString" }
          if ($raw -notlike '*%USERPROFILE%\seeded*') { throw 'the %USERPROFILE%\seeded entry was expanded or lost' }
          $bin = "$HOME\.maxon\bin"
          $count = @($raw -split ';' | Where-Object { $_.TrimEnd('\') -ieq $bin }).Count
          if ($count -ne 1) { throw "$bin is on the user Path $count times" }
          $env:Path = [Environment]::ExpandEnvironmentVariables([Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + $raw)
          $found = (Get-Command maxon).Source
          if ($found -ine "$bin\maxon.exe") { throw "a new terminal runs '$found'" }

      - name: It compiles and runs a program outside any checkout
        run: |
          $work = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'hello')
          Copy-Item "$HOME\.maxon\examples\hello.maxon" $work
          Set-Location $work
          & "$HOME\.maxon\bin\maxon.exe" build hello.maxon --output=hello.exe
          if ($LASTEXITCODE -ne 0) { throw 'the build failed' }
          $out = & .\hello.exe
          if ($out -ne 'Hello, world!') { throw "hello printed '$out'" }

      - name: Running it again says the install is current and leaves the user PATH alone
        run: |
          $before = [Environment]::GetEnvironmentVariable('Path', 'User')
          $out = & ([scriptblock]::Create((Get-Content -Raw website/public/install.ps1))) 6>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'already installed') { throw 'a rerun did not report the install as current' }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -ne $before) { throw 'a rerun changed the user Path' }

      # Exactly as the install page prints it, in the session it is typed into. It is the published copy it
      # fetches, not this checkout's.
      - name: The published one-liner finds the install current
        run: |
          $out = & { irm https://maxon.dev/install.ps1 | iex } 6>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'already installed') { throw 'the published one-liner did not find the install current' }

      # ⭐ A POWERSHELL STARTED FOR THE SCRIPT CANNOT CHANGE ITS CALLER'S PATH, so it must print the line
      # that does, in the caller's syntax — and running that line must be what makes `maxon` resolve.
      # The step's own PATH never held the install, so the line cannot pass by finding it already there.
      - name: Run from cmd.exe, it prints the line that puts `maxon` on cmd.exe's PATH
        run: |
          $script = (Resolve-Path website/public/install.ps1).Path
          $install = Join-Path $env:RUNNER_TEMP 'install-from-cmd.cmd'
          Set-Content -LiteralPath $install -Encoding ascii -Value @('@echo off', "powershell -NoProfile -Command ""Get-Content -Raw '$script' | Invoke-Expression""")
          $out = & cmd.exe /d /c $install | Out-String
          $out
          $line = [regex]::Match($out, 'to run `maxon` in it now:  (set "PATH=.*")')
          if (-not $line.Success) { throw 'no cmd.exe PATH line was printed' }
          $use = Join-Path $env:RUNNER_TEMP 'use-from-cmd.cmd'
          Set-Content -LiteralPath $use -Encoding ascii -Value @('@echo off', $line.Groups[1].Value, 'where maxon')
          $found = @(& cmd.exe /d /c $use)[0]
          if ($found -ine "$HOME\.maxon\bin\maxon.exe") { throw "cmd.exe finds '$found' after the printed line" }

      - name: Run by a child PowerShell, it prints the line that puts `maxon` on its caller's PATH
        run: |
          $script = (Resolve-Path website/public/install.ps1).Path
          $out = & powershell -NoProfile -Command "Get-Content -Raw '$script' | Invoke-Expression" | Out-String
          $out
          $line = [regex]::Match($out, 'to run `maxon` in it now:  (\$env:Path \+= .*)')
          if (-not $line.Success) { throw 'no PowerShell PATH line was printed' }
          Invoke-Expression $line.Groups[1].Value
          $found = (Get-Command maxon -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          if ($found -ine "$HOME\.maxon\bin\maxon.exe") { throw "the caller finds '$found' after the printed line" }

      - name: maxon upgrade finds the install current
        run: |
          $ErrorActionPreference = 'Continue'
          $maxon = "$HOME\.maxon\bin\maxon.exe"
          & $maxon help upgrade *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::notice::the latest release has no maxon upgrade yet'
            $global:LASTEXITCODE = 0
            return
          }
          & $maxon upgrade --dry-run
          if ($LASTEXITCODE -ne 0) { throw "maxon upgrade --dry-run failed ($LASTEXITCODE)" }
          $out = & $maxon upgrade 2>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'already installed') { throw 'maxon upgrade did not find the install current' }

      # ⭐ AN UPGRADE THAT MOVES THE INSTALL. The compiler that runs the script is the one it replaces, so
      # this is also the rename-aside path, driven by `maxon upgrade` itself rather than by a test harness.
      - name: maxon upgrade moves an older install to the latest release
        run: |
          $ErrorActionPreference = 'Continue'
          . ([scriptblock]::Create($env:RELEASE_HELPERS_PS))
          $latest = Get-ReleaseVersion
          if ($latest -eq $env:FIRST_UPGRADE_RELEASE) {
            Write-Host '::notice::the latest release is the first with maxon upgrade, so there is nothing older to upgrade'
            $global:LASTEXITCODE = 0
            return
          }
          $install = [scriptblock]::Create((Get-Content -Raw website/public/install.ps1))
          $env:MAXON_INSTALL = Join-Path $env:RUNNER_TEMP 'upgrade-from-older'
          $maxon = "$env:MAXON_INSTALL\bin\maxon.exe"
          & $install -Version $env:FIRST_UPGRADE_RELEASE -NoPathUpdate
          if ($LASTEXITCODE -ne 0) { throw "installing $env:FIRST_UPGRADE_RELEASE failed" }
          if ("$(& $maxon version)" -notlike "maxon $env:FIRST_UPGRADE_RELEASE *") { throw "the older install does not report $env:FIRST_UPGRADE_RELEASE" }

          # The root comes from where the compiler is, so a caller's MAXON_INSTALL naming nothing must not matter.
          $env:MAXON_INSTALL = Join-Path $env:RUNNER_TEMP 'upgrade-decoy'
          $out = & $maxon upgrade 2>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0) { throw "maxon upgrade failed ($LASTEXITCODE)" }
          $reported = "$(& $maxon version)"
          $reported
          if ($reported -notlike "maxon $latest *") { throw "after maxon upgrade the install reports '$reported', not $latest" }
          if (Test-Path -LiteralPath $env:MAXON_INSTALL) { throw 'maxon upgrade installed into the caller''s MAXON_INSTALL' }

          $out = & $maxon upgrade 2>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'already installed') { throw 'a second maxon upgrade did not find the install current' }

      - name: A specific version installs, and -Force reinstalls the latest over it
        run: |
          $install = [scriptblock]::Create((Get-Content -Raw website/public/install.ps1))
          . ([scriptblock]::Create($env:RELEASE_HELPERS_PS))
          $latest = Get-ReleaseVersion
          & $install -Version 0.1.0
          if ($LASTEXITCODE -ne 0) { throw '-Version 0.1.0 failed' }
          if ("$(& "$HOME\.maxon\bin\maxon.exe" version)" -like "maxon $latest *") { throw '-Version 0.1.0 left the latest release in place' }
          & $install -Force
          if ("$(& "$HOME\.maxon\bin\maxon.exe" version)" -notlike "maxon $latest *") { throw '-Force did not install the latest release' }
          $leftovers = @(Get-ChildItem -Force "$HOME\.maxon" | Where-Object Name -like '.*')
          if ($leftovers.Count -ne 0) { throw "left behind: $($leftovers.Name)" }

      # `maxon upgrade` runs this script from the compiler it replaces.
      - name: An install replaces a running compiler, and the next run removes the old one
        run: |
          $install = [scriptblock]::Create((Get-Content -Raw website/public/install.ps1))
          $info = New-Object Diagnostics.ProcessStartInfo "$HOME\.maxon\bin\maxon.exe", 'lsp-server'
          $info.UseShellExecute = $false
          $info.RedirectStandardInput = $true
          $info.RedirectStandardOutput = $true
          $server = [Diagnostics.Process]::Start($info)
          Start-Sleep -Seconds 1
          if ($server.HasExited) { throw 'the language server did not stay up' }
          & $install -Force
          if ($LASTEXITCODE -ne 0) { throw 'the install over a running compiler failed' }
          if (-not (Test-Path "$HOME\.maxon\bin\maxon.exe.old")) { throw 'the running compiler was not renamed aside' }
          $server.StandardInput.Close()
          if (-not $server.WaitForExit(10000)) { $server.Kill() }
          & $install -Force
          if (Test-Path "$HOME\.maxon\bin\maxon.exe.old*") { throw 'the old compiler was not removed' }

      - name: A locked standard library leaves the install as it was
        run: |
          $install = [scriptblock]::Create((Get-Content -Raw website/public/install.ps1))
          $file = Get-ChildItem "$HOME\.maxon\stdlib" -Filter *.maxon | Select-Object -First 1
          $before = (Get-FileHash "$HOME\.maxon\bin\maxon.exe").Hash
          $stream = [IO.File]::Open($file.FullName, 'Open', 'Read', 'Read')
          try { & $install -Force } finally { $stream.Close() }
          if ($LASTEXITCODE -ne 1) { throw "a locked stdlib did not fail the install ($LASTEXITCODE)" }
          if ((Get-FileHash "$HOME\.maxon\bin\maxon.exe").Hash -ne $before) { throw 'the failed install changed the compiler' }
          if (-not (Test-Path "$HOME\.maxon\stdlib\$($file.Name)")) { throw 'the standard library was not restored' }
          $leftovers = @(Get-ChildItem -Force "$HOME\.maxon" | Where-Object Name -like '.*')
          if ($leftovers.Count -ne 0) { throw "left behind: $($leftovers.Name)" }
          $global:LASTEXITCODE = 0

      # ⛔ THE REFUSAL IS THE SCRIPT'S ONE SECURITY CLAIM, SO IT IS MADE TO FIRE.
      - name: A checksum mismatch installs nothing
        run: |
          $install = [scriptblock]::Create((Get-Content -Raw website/public/install.ps1))
          . ([scriptblock]::Create($env:RELEASE_HELPERS_PS))
          $staged = New-Mirror 'mirror' '${{ matrix.target }}' '${{ matrix.archive }}'
          Set-Content -Path "$($staged.Dir)\SHA256SUMS" -Value (('0' * 64) + "  $($staged.Asset)") -Encoding ascii
          $mirror = Start-Mirror $staged.Root 8765
          $before = (Get-FileHash "$HOME\.maxon\bin\maxon.exe").Hash
          $env:MAXON_DOWNLOAD_BASE = $mirror.Url
          try { & $install -Version $staged.Version -Force } finally { Stop-Mirror $mirror.Server }
          if ($LASTEXITCODE -ne 1) { throw 'a tampered SHA256SUMS was accepted' }
          if ((Get-FileHash "$HOME\.maxon\bin\maxon.exe").Hash -ne $before) { throw 'the failed install changed the existing one' }
          $global:LASTEXITCODE = 0

      - name: A release whose SHA256SUMS lists no build for this machine installs nothing and downloads no archive
        run: |
          $script = (Resolve-Path website/public/install.ps1).Path
          . ([scriptblock]::Create($env:RELEASE_HELPERS_PS))
          $staged = New-Mirror 'mirror-unlisted' '${{ matrix.target }}' '${{ matrix.archive }}'
          $version = $staged.Version
          $asset = $staged.Asset
          Save-ReleaseFile $staged.Dir $version SHA256SUMS
          $kept = @(Get-Content -LiteralPath "$($staged.Dir)\SHA256SUMS" | Where-Object { $_ -notlike "*$asset*" })
          if ($kept.Count -eq 0) { throw 'the release lists no other build, so the mirror proves nothing' }
          Set-Content -LiteralPath "$($staged.Dir)\SHA256SUMS" -Value $kept -Encoding ascii
          $mirror = Start-Mirror $staged.Root 8766
          $before = (Get-FileHash "$HOME\.maxon\bin\maxon.exe").Hash
          $env:MAXON_DOWNLOAD_BASE = $mirror.Url
          $command = "& ([scriptblock]::Create((Get-Content -Raw '$script'))) -Version $version -Force -NoPathUpdate; exit `$LASTEXITCODE"
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($command))
          $info = New-Object Diagnostics.ProcessStartInfo '${{ matrix.edition }}.exe', "-NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded"
          $info.UseShellExecute = $false
          $info.RedirectStandardError = $true
          try {
            $child = [Diagnostics.Process]::Start($info)
            $err = $child.StandardError.ReadToEnd()
            $child.WaitForExit()
          } finally {
            Stop-Mirror $mirror.Server
          }
          $err
          if ($child.ExitCode -eq 0) { throw 'an install with no listed build succeeded' }
          if ($err -notlike "*Maxon v$version has no build for ${{ matrix.target }}*") { throw "the refusal did not say that v$version has no build for ${{ matrix.target }}" }
          $served = Get-Content -Raw -LiteralPath $mirror.Requests
          if ($served -notlike "*/v$version/SHA256SUMS*") { throw 'the installer never read SHA256SUMS' }
          if ($served -like "*$asset*") { throw "the installer asked the mirror for $asset" }
          if ((Get-FileHash "$HOME\.maxon\bin\maxon.exe").Hash -ne $before) { throw 'the refused install changed the existing one' }

      - name: A scriptlib package the new compiler rejects is reported, and the install still succeeds
        run: |
          $install = [scriptblock]::Create((Get-Content -Raw website/public/install.ps1))
          $env:MAXON_INSTALL = Join-Path $env:RUNNER_TEMP 'scriptlib-notice'
          & $install -NoPathUpdate
          if ($LASTEXITCODE -ne 0) { throw 'the install failed' }
          $maxon = "$env:MAXON_INSTALL\bin\maxon.exe"
          & $maxon help check-scriptlib *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::notice::the latest release has no maxon check-scriptlib yet'
            Remove-Item Env:MAXON_INSTALL
            $global:LASTEXITCODE = 0
            return
          }
          $package = New-Item -ItemType Directory -Force -Path "$env:MAXON_INSTALL\scriptlib\broken"
          Set-Content -LiteralPath "$package\Broken.maxon" -Encoding ascii -Value @('public function broken() returns Count', "`treturn `"not a count`"", "end 'broken'")
          $out = & $install -Force -NoPathUpdate 6>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0) { throw "the install over a rejected scriptlib package failed ($LASTEXITCODE)" }
          if ($out -notmatch 'scriptlib needs updating') { throw 'an install over a scriptlib package the compiler rejects printed no notice' }
          if ($out -notmatch 'Broken.maxon') { throw 'the notice did not carry the compiler''s diagnostics' }
          if (-not (Test-Path -LiteralPath "$package\Broken.maxon")) { throw 'the install removed the user''s scriptlib package' }
          Remove-Item Env:MAXON_INSTALL

      - name: MAXON_INSTALL with -NoPathUpdate installs anywhere and leaves the user PATH alone
        run: |
          $install = [scriptblock]::Create((Get-Content -Raw website/public/install.ps1))
          $before = [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:MAXON_INSTALL = Join-Path $env:RUNNER_TEMP 'custom'
          & $install -NoPathUpdate
          if ($LASTEXITCODE -ne 0) { throw 'the custom install failed' }
          & "$env:MAXON_INSTALL\bin\maxon.exe" version
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -ne $before) { throw '-NoPathUpdate changed the user Path' }

      # The script runs in a child PowerShell, so its stderr and exit code are read as a caller reads them.
      - name: MAXON_INSTALL refuses a directory that is not an install, and leaves what it holds untouched
        run: |
          $script = (Resolve-Path website/public/install.ps1).Path
          $command = "& ([scriptblock]::Create((Get-Content -Raw '$script'))) -NoPathUpdate; exit `$LASTEXITCODE"
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($command))
          function Get-Snapshot($dir) {
            Get-ChildItem -LiteralPath $dir -Recurse -Force | Sort-Object FullName | ForEach-Object {
              $relative = $_.FullName.Substring($dir.Length)
              if ($_.PSIsContainer) { "$relative\" } else { "$relative $((Get-FileHash -LiteralPath $_.FullName).Hash)" }
            }
          }
          $assignment = @(Select-String -LiteralPath $script -Pattern '^\s*\$installEntries\s*=\s*@\(((\s*''[^'']+''\s*,?)+)\)\s*$')
          if ($assignment.Count -ne 1) { throw 'install.ps1 has no single $installEntries = @(...) assignment' }
          $entries = @([regex]::Matches($assignment[0].Matches[0].Groups[1].Value, '''([^'']+)''') | ForEach-Object { $_.Groups[1].Value })
          if ($entries.Count -eq 0) { throw 'install.ps1''s $installEntries is empty' }
          $entries
          foreach ($entry in $entries) {
            $foreign = (New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "foreign-$entry")).FullName
            $null = New-Item -ItemType Directory -Path "$foreign\$entry"
            Set-Content -LiteralPath "$foreign\$entry\keep" -Encoding ascii -Value 'not ours'
            $before = (Get-Snapshot $foreign) -join "`n"
            $env:MAXON_INSTALL = $foreign
            $info = New-Object Diagnostics.ProcessStartInfo 'powershell.exe', "-NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded"
            $info.UseShellExecute = $false
            $info.RedirectStandardError = $true
            $child = [Diagnostics.Process]::Start($info)
            $err = $child.StandardError.ReadToEnd()
            $child.WaitForExit()
            $err
            if ($child.ExitCode -ne 1) { throw "a directory with its own $entry\ exited $($child.ExitCode), not 1" }
            if ($err -notmatch "$([regex]::Escape($entry)) exists and .*holds no bin\\maxon\.exe") { throw "the refusal over its own $entry\ did not say why" }
            if (((Get-Snapshot $foreign) -join "`n") -ne $before) { throw "the foreign $entry\ was touched" }
          }
          Remove-Item Env:MAXON_INSTALL

      # The exact shape `maxon upgrade` runs, reading success and failure from the exit code alone.
      - name: The upgrade invocation reports its outcome in its exit code
        run: |
          $script = (Resolve-Path website/public/install.ps1).Path
          $command = "& ([scriptblock]::Create((Get-Content -Raw '$script'))) -NoPathUpdate; exit `$LASTEXITCODE"
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $command
          if ($LASTEXITCODE -ne 0) { throw "a current install exited $LASTEXITCODE" }
          $env:MAXON_INSTALL = 'relative'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $command
          if ($LASTEXITCODE -ne 1) { throw "a failed install exited $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
