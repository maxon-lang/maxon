# Every push and pull request: build the compiler and run the whole suite, on every native target.
#
# ⭐⭐ EACH TARGET IS BUILT AND TESTED ON ITS OWN ARCHITECTURE, for the release workflow's reason: a
# green matrix that cross-compiled three of its lanes reports coverage it never had.
#
# ⚠ A REPOSITORY THAT HAS NOT PUBLISHED THE PINNED SEED IS INERT, AND SAYS SO RATHER THAN FAILING. Maxon
# compiles Maxon, so a runner needs a compiler before it can build one and takes the seed that
# `scripts/seed-tag` pins. A fork without that release would fail every job on a condition no contributor
# can fix — so the seed step SKIPS the run and writes a notice instead.
#
# On `main`, `freeze`, `prove` and `pin` replace the pinned seed when the tree carries a
# `scripts/seed-shim/` patch, or when a run is dispatched with `freeze_seed`.
# `docs/RELEASING.md` owns the procedure.

# ⭐ A COMMIT THAT TOUCHES NOTHING THIS WORKFLOW READS DOES NOT RUN IT. The build reads `maxon-bin/`,
# `stdlib/`, `runtime/`, `vendor/`, `project.maxon` and the scripts re-included below; the jobs read
# `specs/` and the `tests/` corpora they run. Everything excluded below is read by none of them — prose,
# editor and agent config, and projects with workflows of their own. `tests/` and `scripts/`
# are excluded because no job here runs the rest of them, so a run on their change reports on code it
# never touched; the corpora and scripts a job does run are re-included, and so are the website pages
# whose snippets `tests/examples` compiles and the workflows and installers `tests/targets` reads. A
# step that starts running another script needs that script re-included here.
#
# ⛔ THE LIST IS EXCLUSIONS, AND A RE-INCLUSION IS WRITTEN ONLY FOR A PATH A JOB READS. A new
# directory therefore runs CI until someone decides it need not, rather than being skipped silently
# until someone notices it should not be. ⚠ The last pattern matching a path wins, so a re-inclusion
# has to sit AFTER the exclusion it reopens — moved above it, it stops applying and nothing says so.
# `*.md` matches the ROOT only — `*` stops at a `/`, and `specs/*.md` is the suite itself.
#
# ⛔ IF THIS EVER BECOMES A REQUIRED STATUS CHECK, a path filter STOPS IT REPORTING AT ALL on a
# pull request it skips, which blocks the merge rather than passing it. This repository develops on
# `main` and has no branch protection today; a future one needs a different shape, not a wider filter.

name: ci

on:
  push:
    branches: [main]
    paths: &ci-inputs
      - '**'
      - '!website/**'
      - '!docs/**'
      - '!*.md'
      - '!**/AGENTS.md'
      - '!LICENSE-*'
      - '!todo.md'
      - '!.claude/**'
      - '!.agents/**'
      - '!.vscode/**'
      - '!.mcp.json'
      - '!.editorconfig'
      - '!.gitignore'
      - '!vscode-extension/**'
      - '!installer/**'
      - '!bench/**'
      - '!tests/**'
      - 'tests/lsp/**'
      - 'tests/fmt/**'
      - 'tests/ladders/**'
      - 'tests/specHarness/**'
      - 'tests/debug/**'
      - 'tests/dap/**'
      - 'tests/mcp/**'
      - 'tests/cli/**'
      - 'tests/buildManifest/**'
      - 'tests/examples/**'
      - 'tests/emittedRuntime/**'
      - 'tests/support/**'
      - 'tests/targets/**'
      - '!scripts/**'
      - 'scripts/fetch-seed.sh'
      - 'scripts/seed-tag'
      - 'scripts/build-from-seed.sh'
      - 'scripts/fetch-vendor.sh'
      - 'scripts/freeze-seed.sh'
      - 'scripts/pin-seed.sh'
      - 'scripts/fixpoint.sh'
      - 'scripts/lib/**'
      - 'scripts/multicore-stress/**'
      - 'scripts/library-cache/**'
      - 'scripts/seed-shim/**'
      - 'scripts/targets/**'
      - 'installer/docker/Dockerfile'
      - 'installer/homebrew/generate.sh'
      - '!.github/**'
      - '.github/workflows/*.yml'
      - 'README.md'
      - 'website/public/install.sh'
      - 'website/public/install.ps1'
      - 'website/src/pages/index.astro'
      - 'website/src/content/docs/docs/getting-started/first-program.md'
      - 'website/src/content/docs/docs/getting-started/introduction.md'
  pull_request:
    paths: *ci-inputs
  workflow_dispatch:
    inputs:
      freeze_seed:
        description: Freeze this commit as the bootstrap seed, prove it on every target, and pin it
        type: boolean
        default: false

# ⭐ A PULL REQUEST CANCELS ITS OWN OLDER RUNS; `main` NEVER CANCELS. Superseding is right on a
# branch still being pushed to — the verdict anyone wants is about the commit that gets MERGED, and a
# run for an intermediate commit spends an hour of runner time on code that will not exist. It is
# wrong on `main`, where "which commit broke it" is the question this workflow is here to answer:
# cancelling commit N's run because N+1 landed is how a break becomes unattributable.
#
# ⚠ THE `run_id` FALLBACK IS WHAT TURNS CANCELLING OFF, and `cancel-in-progress: false` would not.
# A group is the thing that supersedes, and a group still discards a run while it is QUEUED — which a
# `main` run often is, because GitHub Free allows five concurrent macOS jobs and one run uses one.
# Giving each `main` run a group of its own is the only way it is left alone.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.matrix.outputs.native }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            maxon-bin/targets.tsv
            scripts/lib/host-binaries.sh
            scripts/targets/matrix.sh
          sparse-checkout-cone-mode: false

      - name: Read the native targets from the table
        id: matrix
        run: |
          matrix="$(./scripts/targets/matrix.sh json native)"
          echo "native=$matrix" >> "$GITHUB_OUTPUT"

  suite:
    needs: targets
    strategy: &lanes
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.native) }}
    runs-on: ${{ matrix.runner }}
    defaults: &bash-steps
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # A role is matched with a comma on each side, so a role named inside another cannot select a lane.
      - name: Runner CPU
        if: contains(format(',{0},', matrix.roles), ',cpu-probe,')
        continue-on-error: true
        shell: pwsh
        run: |
          try {
            (Get-CimInstance Win32_Processor | Select-Object -First 1 Name, NumberOfLogicalProcessors, Description | Format-List | Out-String).Trim()
            $signature = @(
              '[DllImport("kernel32.dll")] public static extern bool IsProcessorFeaturePresent(uint feature);',
              '[DllImport("kernel32.dll")] public static extern ulong GetEnabledXStateFeatures();',
              '[DllImport("kernel32.dll", SetLastError = true)] public static extern bool InitializeContext(IntPtr buffer, uint flags, out IntPtr context, ref uint length);',
              '[DllImport("kernel32.dll")] public static extern bool IsUserCetAvailableInEnvironment(uint environment);'
            ) -join [Environment]::NewLine
            $native = Add-Type -MemberDefinition $signature -Name CpuProbe -Namespace Runner -PassThru
            $features = $native::GetEnabledXStateFeatures()
            "enabled xstate features: 0x{0:x}" -f $features
            "AVX2={0} AVX512F={1} XSAVE={2}" -f $native::IsProcessorFeaturePresent(40), $native::IsProcessorFeaturePresent(41), $native::IsProcessorFeaturePresent(17)
            "AVX512 state (opmask/ZMM_Hi256/Hi16_ZMM)={0} AMX tile state (bits 17/18)={1} CET user/supervisor state (bits 11/12)={2}" -f
              ((($features -shr 5) -band 7) -eq 7), ((($features -shr 17) -band 3) -eq 3), ((($features -shr 11) -band 3) -ne 0)
            try { "user shadow stack available={0}" -f $native::IsUserCetAvailableInEnvironment(0) } catch { "user shadow stack probe unavailable: $_" }
            $length = [uint32]0
            $context = [IntPtr]::Zero
            [void]$native::InitializeContext([IntPtr]::Zero, 0x10004B, [ref]$context, [ref]$length)
            "CONTEXT with XSTATE size={0} bytes" -f $length
          } catch {
            "CPU probe failed: $_"
          }
          exit 0

      - name: Library cache codecs
        if: contains(format(',{0},', matrix.roles), ',codecs,')
        run: python3 scripts/library-cache/generate-codecs.py --check

      # The seed is the binary alone; `scripts/fetch-seed.sh` says why and is the one place that fetches it.
      - name: Seed from the pinned seed release
        id: seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          allow_none=""; [ "${{ github.repository }}" = "maxon-lang/maxon" ] || allow_none="--allow-none"
          ./scripts/fetch-seed.sh ${{ matrix.target }} $allow_none
          . scripts/lib/host-binaries.sh
          if [ -x "$(maxon_downloaded_path)" ]; then
            echo "seeded=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::the pinned seed release is not published in this repository — CI is inert"
            echo "seeded=no" >> "$GITHUB_OUTPUT"
          fi

      # The seed builds `C1` and `C1` builds `C2`: one build would run the suite on the seed's runtime.
      - name: Build
        if: steps.seed.outputs.seeded == 'yes'
        run: ./scripts/build-from-seed.sh

      - name: Suite
        if: steps.seed.outputs.seeded == 'yes'
        run: ./maxon-bin/.maxon/maxon spec-test

      # The emitted-code cases, in their own directory: every case pins the Target IR its program compiles
      # to on this lane, and a pin the compiler no longer renders fails its case.
      - name: IR suite
        if: steps.seed.outputs.seeded == 'yes'
        run: ./maxon-bin/.maxon/maxon spec-test ir-specs

      # ⭐ IN THE MATRIX RATHER THAN IN A JOB OF ITS OWN, because this area is host-specific where
      # almost nothing else is: percent-decoding a uri, un-rooting a drive letter, and
      # `FilePath.equals` being case-insensitive on Windows alone. A single-host lane would leave
      # three hosts' path handling unexercised, and what it misses are wrong ANSWERS, not breaks.
      - name: LSP corpus
        if: steps.seed.outputs.seeded == 'yes'
        run: ./maxon-bin/.maxon/maxon test tests/lsp

      # These are tree-level gates `spec-test` does not run.
      - name: Formatter corpus
        if: steps.seed.outputs.seeded == 'yes'
        run: ./maxon-bin/.maxon/maxon test tests/fmt

      # `tests/specHarness` runs a spec batch under the wasm target, and `tests/cli` builds it from this
      # checkout: wrapping the core module into a component needs `vendor/wasm-tools` (E6005 without it),
      # and the cross-target suite below runs its programs under `vendor/wasmtime`. `vendor/` is gitignored,
      # so nothing else stages it.
      - name: Stage vendor
        if: steps.seed.outputs.seeded == 'yes'
        run: ./scripts/fetch-vendor.sh ${{ matrix.target }}

      - name: Spec harness corpus
        if: steps.seed.outputs.seeded == 'yes'
        run: ./maxon-bin/.maxon/maxon test tests/specHarness

      - name: Ladder index
        if: steps.seed.outputs.seeded == 'yes'
        run: ./maxon-bin/.maxon/maxon test tests/ladders

      - name: Examples corpus
        if: steps.seed.outputs.seeded == 'yes'
        run: ./maxon-bin/.maxon/maxon test tests/examples

      # The one step with a timeout: a compile that hangs would otherwise run to the job's six-hour
      # default and end cancelled, not failed.
      - name: Multicore stress programs compile
        if: steps.seed.outputs.seeded == 'yes'
        timeout-minutes: 10
        run: bash scripts/multicore-stress/compile-all.sh

      - name: Build manifest corpus
        if: steps.seed.outputs.seeded == 'yes'
        run: ./maxon-bin/.maxon/maxon test tests/buildManifest

      - name: Emitted runtime corpus
        if: steps.seed.outputs.seeded == 'yes'
        run: ./maxon-bin/.maxon/maxon test tests/emittedRuntime

      # ⭐ THE ONLY DEBUGGER CODE CI RUNS. `spec-test` covers the language; the debugger's driver, its
      # DAP server and its MCP tools are exercised by these three corpora and by nothing else, so a lane
      # without them reports a green suite over a debugger that does not start. `matrix.debugger` is the
      # lane's own answer to `BackendChoice.backendForHost`, written once beside the runner rather than
      # three times as a list of triples.
      #
      # ⛔ **THE macOS LANE DEBUGS THROUGH APPLE'S `debugserver`, WHICH IS AUTHORIZED PER MACHINE AND NOT PER
      # PROCESS.** Without developer mode enabled every debug case on that lane is refused for want of
      # authorization, and the Xcode command line tools are where the stub itself comes from.
      - name: Authorize the debug stub
        if: steps.seed.outputs.seeded == 'yes' && matrix.debugger == 'yes' && runner.os == 'macOS'
        run: |
          set -euo pipefail
          xcode-select --print-path
          sudo /usr/sbin/DevToolsSecurity -enable
          /usr/sbin/DevToolsSecurity -status

      - name: Debugger corpus
        if: steps.seed.outputs.seeded == 'yes' && matrix.debugger == 'yes'
        run: ./maxon-bin/.maxon/maxon test tests/debug

      - name: DAP corpus
        if: steps.seed.outputs.seeded == 'yes' && matrix.debugger == 'yes'
        run: ./maxon-bin/.maxon/maxon test tests/dap

      - name: MCP corpus
        if: steps.seed.outputs.seeded == 'yes' && matrix.debugger == 'yes'
        run: ./maxon-bin/.maxon/maxon test tests/mcp

      - name: CLI corpus
        if: steps.seed.outputs.seeded == 'yes'
        run: ./maxon-bin/.maxon/maxon test tests/cli

      # One lane: its programs run under `vendor/wasmtime`, staged above, rather than on the runner's
      # OS, so no lane's host changes what they run on.
      - name: Cross-target suites
        if: steps.seed.outputs.seeded == 'yes' && contains(format(',{0},', matrix.roles), ',cross-suite,')
        run: |
          set -euo pipefail
          targets="$(./scripts/targets/matrix.sh list target cross)"
          for target in $targets; do
            ./maxon-bin/.maxon/maxon spec-test --target="$target"
          done

      - name: Targets table is generated and agrees with the compiler
        if: steps.seed.outputs.seeded == 'yes' && contains(format(',{0},', matrix.roles), ',targets-gate,')
        run: ./scripts/targets/generate.sh --check

      - name: Targets corpus
        if: steps.seed.outputs.seeded == 'yes' && contains(format(',{0},', matrix.roles), ',targets-gate,')
        run: ./maxon-bin/.maxon/maxon test tests/targets

      # ⭐ THE FIXPOINT IS THE ONE CHECK A GREEN SUITE CANNOT STAND IN FOR. Every stage shares the
      # compiler's logic, so the suite exercises the same behaviour whichever stage ran it; only the
      # BYTES of two successive self-compiles say whether the emitted code is stable, and a difference
      # is a miscompile.
      - name: Fixpoint
        if: steps.seed.outputs.seeded == 'yes'
        run: ./scripts/fixpoint.sh

  freeze:
    if: github.repository == 'maxon-lang/maxon' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.freeze_seed))
    runs-on: ubuntu-latest
    defaults: *bash-steps
    outputs:
      freeze: ${{ steps.decide.outputs.freeze }}
      tag: ${{ steps.freeze.outputs.tag }}
      sha: ${{ github.sha }}
    steps:
      - name: Require the main branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::freeze_seed was asked for on $REF — a seed is frozen from refs/heads/main only, so nothing was frozen, proved or pinned"
            exit 1
          fi

      - uses: actions/checkout@v5

      # A shim patch exists only while the pinned seed refuses the tree, so a tree carrying one
      # is owed a new seed.
      - name: Decide whether to freeze
        id: decide
        env:
          FORCED: ${{ inputs.freeze_seed }}
        run: |
          set -euo pipefail
          . scripts/lib/seed.sh
          patches="$(seed_shim_patches)"
          if [ -n "$patches" ] || [ "$FORCED" = true ]; then
            echo "freeze=yes" >> "$GITHUB_OUTPUT"
          else
            echo "freeze=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Seed from the pinned seed release
        if: steps.decide.outputs.freeze == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-seed.sh

      - name: Build
        if: steps.decide.outputs.freeze == 'yes'
        run: ./scripts/build-from-seed.sh

      - name: Freeze
        id: freeze
        if: steps.decide.outputs.freeze == 'yes'
        run: ./scripts/freeze-seed.sh

      - name: Upload the frozen seed
        if: steps.decide.outputs.freeze == 'yes'
        uses: actions/upload-artifact@v6
        with:
          name: seed-dist
          path: temp/seed/dist
          if-no-files-found: error

  prove:
    needs: [targets, freeze]
    if: needs.freeze.outputs.freeze == 'yes'
    strategy: *lanes
    runs-on: ${{ matrix.runner }}
    defaults: *bash-steps
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.freeze.outputs.sha }}

      - uses: actions/download-artifact@v7
        with:
          name: seed-dist
          path: temp/seed/dist

      - name: Seed from the frozen archives
        env:
          TAG: ${{ needs.freeze.outputs.tag }}
        run: ./scripts/fetch-seed.sh "$TAG" ${{ matrix.target }} --from=temp/seed/dist

      # The pin deletes every patch, so each archive builds the tree with none, on its own
      # architecture, before anything is published.
      - name: Build with no shim
        run: ./scripts/build-from-seed.sh --unshimmed

  pin:
    needs: [suite, freeze, prove]
    if: needs.freeze.outputs.freeze == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    # A pin cancelled between publishing and pushing would leave a published seed that nothing pins.
    concurrency:
      group: seed-pin
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: seed-dist
          path: temp/seed/dist

      - name: Publish the seed and pin it
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.freeze.outputs.sha }}
          TAG: ${{ needs.freeze.outputs.tag }}
        run: ./scripts/pin-seed.sh --sha="$SHA" --tag="$TAG"
