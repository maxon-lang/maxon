# Every push and pull request: build the compiler and run the whole suite, on all four targets.
#
# ⭐⭐ EACH TARGET IS BUILT AND TESTED ON ITS OWN ARCHITECTURE, for the release workflow's reason: a
# green matrix that cross-compiled three of its lanes reports coverage it never had.
#
# ⚠ THIS IS INERT UNTIL v0.1.0 EXISTS, AND SAYS SO RATHER THAN FAILING. Maxon compiles Maxon, so a
# runner needs a compiler before it can build one and takes the last published release. Until there is
# one, every job would fail on a condition no contributor can fix — so the seed step SKIPS the run and
# writes a notice instead. It becomes real the moment a release is published, with no edit here.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# ⭐ A PULL REQUEST CANCELS ITS OWN OLDER RUNS; `main` NEVER CANCELS. Superseding is right on a
# branch still being pushed to — the verdict anyone wants is about the commit that gets MERGED, and a
# run for an intermediate commit spends an hour of runner time on code that will not exist. It is
# wrong on `main`, where "which commit broke it" is the question this workflow is here to answer:
# cancelling commit N's run because N+1 landed is how a break becomes unattributable.
#
# ⚠ THE `run_id` FALLBACK IS WHAT TURNS CANCELLING OFF, and `cancel-in-progress: false` would not.
# A group is the thing that supersedes, and a group still discards a run while it is QUEUED — which a
# `main` run often is, because GitHub Free allows five concurrent macOS jobs and one run uses one.
# Giving each `main` run a group of its own is the only way it is left alone.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64-windows
            runner: windows-latest
          - target: x64-linux
            runner: ubuntu-latest
          - target: arm64-macos
            runner: macos-15
          - target: arm64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # ⛔ THE SEED IS THE BINARY ALONE. A release archive ships its own `stdlib/`, and the compiler
      # resolves `stdlib/` by walking UP from its own executable — so an archive unpacked whole would
      # leave a RELEASED stdlib one directory above the seed, and this checkout's own would never be
      # read. The build would succeed and compile the wrong library, silently.
      - name: Seed from the last release
        id: seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prev="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            echo "::notice::no published release to seed from yet — CI is inert until v0.1.0"
            echo "seeded=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          work="$(mktemp -d)"
          gh release download "$prev" --pattern "*${{ matrix.target }}*" --dir "$work"
          archive="$(find "$work" -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | head -n1)"
          [ -n "$archive" ] || { echo "::error::$prev publishes no archive for ${{ matrix.target }}"; exit 1; }
          case "$archive" in
            *.zip)    unzip -q "$archive" -d "$work/x" ;;
            *.tar.gz) mkdir -p "$work/x" && tar -xzf "$archive" -C "$work/x" ;;
          esac
          found="$(find "$work/x" -type f \( -name 'maxon' -o -name 'maxon.exe' \) | head -n1)"
          [ -n "$found" ] || { echo "::error::no maxon binary in $prev's ${{ matrix.target }} archive"; exit 1; }
          mkdir -p .bootstrap
          cp "$found" ".bootstrap/$(basename "$found")"
          chmod +x .bootstrap/*
          echo "seeded=yes" >> "$GITHUB_OUTPUT"

      # ⛔ `Version.maxon` IS GENERATED, GITIGNORED, AND NOT REACHABLE FROM HERE. `build.maxon`
      # writes it, and only a MANIFEST build runs `build.maxon` — the seed is the previous release and
      # reads `maxon-bin` as a path, which is why the build below names its output. So a fresh checkout
      # has no `CompilerVersion` and every lane fails to compile before reaching the suite.
      #
      # ⭐ `dev` IS THE ANSWER HERE, NOT A STAND-IN FOR ONE. This workflow runs on `main` and on pull
      # requests, and `build.maxon` answers `dev` for every ref that is not a `vX.Y.Z` tag or a
      # `release/X.Y.Z` branch — so there is no ref this can reach where the two would disagree. The
      # commit and date are the run's own, which is what makes a CI failure attributable.
      #
      # ⚠ THE VERSION POLICY IS NOT DUPLICATED HERE and must not be. Deciding a NUMBER from a ref is
      # `build.maxon`'s alone; this writes the absence of one.
      - name: Stamp a dev version
        if: steps.seed.outputs.seeded == 'yes'
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short HEAD)"
          day="$(git log -1 --format=%cd --date=short)"
          {
            echo '// GENERATED by ci.yml. Not tracked; see that file for why.'
            echo 'export let CompilerVersion = "dev"'
            echo 'export let CompilerCommit = "'"$sha"'"'
            echo 'export let CompilerCommitDate = "'"$day"'"'
          } > maxon-bin/Compiler/Version.maxon
          cat maxon-bin/Compiler/Version.maxon

      # ⛔ THE SEED IS RUN DIRECTLY, because the slot is empty on a fresh checkout and `maxon build`
      # needs a compiler before it can make one. `build.maxon` at the root says what gets built.
      - name: Build
        if: steps.seed.outputs.seeded == 'yes'
        run: |
          set -euo pipefail
          # ⚠ AN `if`, NOT `[ … ] && …`. Under `set -e` a trailing test that answers FALSE is the
          # step's exit status, so the non-Windows lanes would fail here having done nothing wrong.
          seed=".bootstrap/maxon"
          if [ -f "$seed.exe" ]; then
            seed="$seed.exe"
          fi
          # ⛔ THE OUTPUT IS NAMED EXPLICITLY, because the SEED is the previous release and may predate
          # named manifest targets. Such a seed reads `maxon-bin` as a PATH and writes the compiler to
          # its own default location — MEASURED: `maxon-bin/Profile/ProfileSampler`, after which the
          # suite step cannot find a compiler. `-o` is correct under both readings.
          "./$seed" build maxon-bin -o maxon-bin/.maxon/maxon

      # The formatter's own gate and the duplicate-error-code check both ride inside `spec-test`, so
      # this one command is the whole battery.
      - name: Suite
        if: steps.seed.outputs.seeded == 'yes'
        run: ./maxon-bin/.maxon/maxon spec-test

      # ⭐ THE FIXPOINT IS THE ONE CHECK A GREEN SUITE CANNOT STAND IN FOR. Every stage shares the
      # compiler's logic, so the suite exercises the same behaviour whichever stage ran it; only the
      # BYTES of two successive self-compiles say whether the emitted code is stable, and a difference
      # is a miscompile.
      - name: Fixpoint
        if: steps.seed.outputs.seeded == 'yes'
        run: ./scripts/fixpoint.sh
