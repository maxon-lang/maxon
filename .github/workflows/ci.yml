# Every push and pull request: build the compiler and run the whole suite, on every native target.
#
# ⭐⭐ EACH TARGET IS BUILT AND TESTED ON ITS OWN ARCHITECTURE, for the release workflow's reason: a
# green matrix that cross-compiled three of its lanes reports coverage it never had.
#
# ⚠ A REPOSITORY THAT HAS NOT PUBLISHED THE PINNED SEED IS INERT, AND SAYS SO RATHER THAN FAILING. Maxon
# compiles Maxon, so a runner needs a compiler before it can build one and takes the seed that
# `scripts/seed-tag` pins. A fork without that release would fail every job on a condition no contributor
# can fix — so the seed step SKIPS the run and writes a notice instead.

# ⭐ A COMMIT THAT TOUCHES NOTHING THIS WORKFLOW READS DOES NOT RUN IT. The build reads `maxon-bin/`,
# `stdlib/`, `runtime/`, `vendor/`, `project.maxon` and the scripts re-included below; the jobs read
# `specs/` and every `tests/` corpus, because `scripts/run-test-corpora.sh` runs each one and a
# corpus that stops compiling must fail the run that changed it. Everything excluded below is read by
# none of them — prose, editor and agent config, and projects with workflows of their own. `scripts/`
# is excluded because no job here runs the rest of it, so a run on its change reports on code it never
# touched; the scripts a job does run are re-included, and so are the website pages whose snippets
# `tests/examples` compiles and the workflows and installers `tests/targets` reads. A step that starts
# running another script needs that script, and any file it reads, re-included here.
#
# ⛔ THE LIST IS EXCLUSIONS, AND A RE-INCLUSION IS WRITTEN ONLY FOR A PATH A JOB READS. A new
# directory therefore runs CI until someone decides it need not, rather than being skipped silently
# until someone notices it should not be. ⚠ The last pattern matching a path wins, so a re-inclusion
# has to sit AFTER the exclusion it reopens — moved above it, it stops applying and nothing says so.
# `*.md` matches the ROOT only — `*` stops at a `/`, and `specs/*.md` is the suite itself.
#
# ⛔ IF THIS EVER BECOMES A REQUIRED STATUS CHECK, a path filter STOPS IT REPORTING AT ALL on a
# pull request it skips, which blocks the merge rather than passing it. This repository develops on
# `main` and has no branch protection today; a future one needs a different shape, not a wider filter.

name: ci

on:
  push:
    branches: [main]
    paths: &ci-inputs
      - '**'
      - '!website/**'
      - '!docs/**'
      - '!*.md'
      - '!**/AGENTS.md'
      - '!LICENSE-*'
      - '!todo.md'
      - '!.claude/**'
      - '!.agents/**'
      - '!.vscode/**'
      - '!.mcp.json'
      - '!.editorconfig'
      - '!.gitignore'
      - '!vscode-extension/**'
      - '!installer/**'
      - '!bench/**'
      - '!tests/README.md'
      - '!scripts/**'
      - 'scripts/run-test-corpora.sh'
      - 'scripts/build-script-programs.sh'
      - 'scripts/fetch-seed.sh'
      - 'scripts/seed-tag'
      - 'scripts/build-from-seed.sh'
      - 'scripts/fetch-vendor.sh'
      - 'scripts/lib/**'
      - 'scripts/multicore-stress/**'
      - 'scripts/debugstream-stress/**'
      - 'scripts/library-cache/**'
      - 'scripts/targets/**'
      - 'scripts/bench_common.py'
      - 'scripts/test-bench-common.py'
      - 'scripts/check-ignored-files.py'
      - 'scripts/allowed-ignored-paths.txt'
      - 'installer/docker/Dockerfile'
      - 'installer/homebrew/generate.sh'
      - '!.github/**'
      - '.github/workflows/*.yml'
      - 'README.md'
      - 'website/public/install.sh'
      - 'website/public/install.ps1'
      - 'website/src/pages/index.astro'
      - 'website/src/content/docs/docs/getting-started/first-program.md'
      - 'website/src/content/docs/docs/getting-started/introduction.md'
  pull_request:
    paths: *ci-inputs
  workflow_dispatch:

# ⭐ A PULL REQUEST CANCELS ITS OWN OLDER RUNS; `main` NEVER CANCELS. Superseding is right on a
# branch still being pushed to — the verdict anyone wants is about the commit that gets MERGED, and a
# run for an intermediate commit spends runner time on code that will not exist. It is
# wrong on `main`, where "which commit broke it" is the question this workflow is here to answer:
# cancelling commit N's run because N+1 landed is how a break becomes unattributable.
#
# ⚠ THE `run_id` FALLBACK IS WHAT TURNS CANCELLING OFF, and `cancel-in-progress: false` would not.
# A group is the thing that supersedes, and a group still discards a run while it is QUEUED — which a
# `main` run often is, because GitHub Free allows five concurrent macOS jobs and one run's macOS
# lane alone needs more.
# Giving each `main` run a group of its own is the only way it is left alone.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SUITE_SHARDS: 4

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.matrix.outputs.native }}
      shards: ${{ steps.matrix.outputs.shards }}
      cross-shards: ${{ steps.matrix.outputs.cross-shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            maxon-bin/targets.tsv
            scripts/lib/host-binaries.sh
            scripts/targets/matrix.sh
          sparse-checkout-cone-mode: false

      - name: Read the native targets from the table
        id: matrix
        run: |
          shards="$(seq -s, 1 "$SUITE_SHARDS")"
          echo "native=$(./scripts/targets/matrix.sh json native)" >> "$GITHUB_OUTPUT"
          echo "shards=$(./scripts/targets/matrix.sh json --with shard="$shards" native)" >> "$GITHUB_OUTPUT"
          echo "cross-shards=$(./scripts/targets/matrix.sh json --with shard="$shards" native roles=cross-suite)" >> "$GITHUB_OUTPUT"

  corpora:
    needs: targets
    strategy: &lanes
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.native) }}
    runs-on: ${{ matrix.runner }}
    defaults: &bash-steps
      run:
        shell: bash
    steps:
      - &checkout
        uses: actions/checkout@v5

      # A role is matched with a comma on each side, so a role named inside another cannot select a lane.
      - name: Runner CPU
        if: contains(format(',{0},', matrix.roles), ',cpu-probe,')
        continue-on-error: true
        shell: pwsh
        run: |
          try {
            (Get-CimInstance Win32_Processor | Select-Object -First 1 Name, NumberOfLogicalProcessors, Description | Format-List | Out-String).Trim()
            $signature = @(
              '[DllImport("kernel32.dll")] public static extern bool IsProcessorFeaturePresent(uint feature);',
              '[DllImport("kernel32.dll")] public static extern ulong GetEnabledXStateFeatures();',
              '[DllImport("kernel32.dll", SetLastError = true)] public static extern bool InitializeContext(IntPtr buffer, uint flags, out IntPtr context, ref uint length);',
              '[DllImport("kernel32.dll")] public static extern bool IsUserCetAvailableInEnvironment(uint environment);'
            ) -join [Environment]::NewLine
            $native = Add-Type -MemberDefinition $signature -Name CpuProbe -Namespace Runner -PassThru
            $features = $native::GetEnabledXStateFeatures()
            "enabled xstate features: 0x{0:x}" -f $features
            "AVX2={0} AVX512F={1} XSAVE={2}" -f $native::IsProcessorFeaturePresent(40), $native::IsProcessorFeaturePresent(41), $native::IsProcessorFeaturePresent(17)
            "AVX512 state (opmask/ZMM_Hi256/Hi16_ZMM)={0} AMX tile state (bits 17/18)={1} CET user/supervisor state (bits 11/12)={2}" -f
              ((($features -shr 5) -band 7) -eq 7), ((($features -shr 17) -band 3) -eq 3), ((($features -shr 11) -band 3) -ne 0)
            try { "user shadow stack available={0}" -f $native::IsUserCetAvailableInEnvironment(0) } catch { "user shadow stack probe unavailable: $_" }
            $length = [uint32]0
            $context = [IntPtr]::Zero
            [void]$native::InitializeContext([IntPtr]::Zero, 0x10004B, [ref]$context, [ref]$length)
            "CONTEXT with XSTATE size={0} bytes" -f $length
          } catch {
            "CPU probe failed: $_"
          }
          exit 0

      - name: Library cache codecs
        if: contains(format(',{0},', matrix.roles), ',codecs,')
        run: python3 scripts/library-cache/generate-codecs.py --check

      - name: Bench harness ref-compiler cache
        if: contains(format(',{0},', matrix.roles), ',codecs,')
        run: python3 scripts/test-bench-common.py

      # The seed is the binary alone; `scripts/fetch-seed.sh` says why and is the one place that fetches it.
      - &seed
        name: Seed from the pinned seed release
        id: seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          allow_none=""; [ "${{ github.repository }}" = "maxon-lang/maxon" ] || allow_none="--allow-none"
          ./scripts/fetch-seed.sh ${{ matrix.target }} $allow_none
          . scripts/lib/host-binaries.sh
          if [ -x "$(maxon_downloaded_path)" ]; then
            echo "seeded=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::the pinned seed release is not published in this repository — CI is inert"
            echo "seeded=no" >> "$GITHUB_OUTPUT"
          fi

      # The seed builds `C1` and `C1` builds `C2`: one build would run the suite on the seed's runtime.
      - &build
        name: Build
        if: steps.seed.outputs.seeded == 'yes'
        run: ./scripts/build-from-seed.sh

      # Samples memory and the largest processes for the rest of the job into the log "Resource evidence"
      # prints: a step killed by its timeout or by the OOM killer leaves no such record in its own log.
      - &sampler
        name: Start the resource sampler
        if: steps.seed.outputs.seeded == 'yes' && runner.os != 'Windows'
        run: |
          ranked_processes() {
            ps -eo pid,ppid,pgid,stat,rss,etime,args | cut -c1-240 | { IFS= read -r header; echo "$header"; sort -k5,5nr | head -n 25; }
          }

          sample() {
            echo "@ $(date -u +%FT%TZ)"

            case "$RUNNER_OS" in
              Linux)
                free -m
                ranked_processes
                ;;
              macOS)
                vm_stat
                sysctl vm.swapusage
                ranked_processes
                ;;
              *)
                echo "no sampler for $RUNNER_OS"
                ;;
            esac
          }

          log="$RUNNER_TEMP/resource-samples.log"
          (
            set +e +o pipefail
            while true; do
              sample
              sleep 5
            done
          ) > "$log" 2>&1 < /dev/null &
          disown
          echo "sampling every 5 s into $log"

      # Detached through `Start-Process`: a Git Bash background job holds the step's stdout pipe open, and
      # the runner waits for that pipe's EOF, so the step would never end.
      - &sampler-windows
        name: Start the resource sampler (Windows)
        if: steps.seed.outputs.seeded == 'yes' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'resource-sampler.ps1'
          $log = Join-Path $env:RUNNER_TEMP 'resource-samples.log'

          Set-Content -Path $script -Encoding utf8 -Value '
          param([string]$Log)
          $ErrorActionPreference = "SilentlyContinue"
          $sample = 0
          while ($true) {
            try {
              $os = Get-CimInstance Win32_OperatingSystem
              $lines = @("@ " + (Get-Date).ToUniversalTime().ToString("o"))
              $lines += "free={0}MB total={1}MB" -f [int]($os.FreePhysicalMemory / 1024), [int]($os.TotalVisibleMemorySize / 1024)
              $lines += Get-Process | Sort-Object WS -Descending | Select-Object -First 25 Id, @{n="RssMB";e={[int]($_.WS / 1MB)}}, StartTime, ProcessName | Format-Table -AutoSize | Out-String -Width 400
              if ($sample % 4 -eq 0) {
                $lines += Get-CimInstance Win32_Process | Sort-Object WorkingSetSize -Descending | Select-Object -First 25 ProcessId, ParentProcessId, CommandLine | Format-Table -AutoSize | Out-String -Width 400
              }
              $lines | Out-File -FilePath $Log -Append -Encoding utf8
            } catch {
              "sample failed: $_" | Out-File -FilePath $Log -Append -Encoding utf8
            }
            $sample++
            Start-Sleep -Seconds 15
          }
          '

          $sampler = Start-Process -FilePath pwsh -WindowStyle Hidden -PassThru -ArgumentList '-NoProfile', '-File', "`"$script`"", "`"$log`""
          "sampling every 15 s into $log (pid $($sampler.Id))"

      # `specs/tls-interop.md` handshakes with a live `openssl`; the script names the one this lane uses
      # (macOS ships LibreSSL, so it installs Homebrew's) and fails the lane when it is too old.
      - &openssl
        name: OpenSSL for the TLS interop cases
        if: steps.seed.outputs.seeded == 'yes'
        run: |
          set -euo pipefail
          openssl="$(./scripts/openssl-for-interop.sh)"
          echo "MAXON_OPENSSL=$openssl" >> "$GITHUB_ENV"

      # Steps run cheapest first, and a failed step skips every later one: a slow step added ahead of a
      # job's checks makes each red behind it wait for that step.

      # `tests/specHarness` runs a spec batch under the wasm target, and `tests/cli` builds it from this
      # checkout: wrapping the core module into a component needs `vendor/wasm-tools` (E6005 without it),
      # and the cross-target suite runs its programs under `vendor/wasmtime`. `vendor/` is gitignored,
      # so nothing else stages it. The cache key is the script, which pins every version and SHA-256, so
      # a hit restores exactly what the script would fetch and its stamps make the fetch a no-op.
      - &vendorcache
        name: Restore vendor
        if: steps.seed.outputs.seeded == 'yes'
        uses: actions/cache@v4
        with:
          path: |
            vendor/wasmtime
            vendor/wasm-tools
          key: vendor-${{ matrix.target }}-${{ hashFiles('scripts/fetch-vendor.sh') }}

      - &vendor
        name: Stage vendor
        if: steps.seed.outputs.seeded == 'yes'
        run: ./scripts/fetch-vendor.sh ${{ matrix.target }}

      - name: Targets table is generated and agrees with the compiler
        if: steps.seed.outputs.seeded == 'yes' && contains(format(',{0},', matrix.roles), ',targets-gate,')
        run: ./scripts/targets/generate.sh --check

      # A step with a timeout: a compile that hangs would otherwise run to the job's six-hour
      # default and end cancelled, not failed.
      - name: Multicore stress programs compile
        if: steps.seed.outputs.seeded == 'yes'
        timeout-minutes: 10
        run: bash scripts/multicore-stress/compile-all.sh

      - name: Every script program builds
        if: steps.seed.outputs.seeded == 'yes'
        run: bash scripts/build-script-programs.sh

      - name: Every stdlib function compiles for every target
        if: steps.seed.outputs.seeded == 'yes'
        run: ./maxon-bin/.maxon/maxon check-stdlib

      # The emitted-code cases, in their own directory: every case pins the Target IR its program compiles
      # to on this lane, and a pin the compiler no longer renders fails its case.
      - name: IR suite
        if: steps.seed.outputs.seeded == 'yes'
        run: ./maxon-bin/.maxon/maxon spec-test ir-specs

      - name: IR suite in reversed source order
        if: steps.seed.outputs.seeded == 'yes'
        env:
          MAXON_SOURCE_ORDER: reversed
        run: ./maxon-bin/.maxon/maxon spec-test ir-specs

      # Tags exist only in a `--debugstream` compiler. This builds one and fails when an allocation
      # report names no real tag.
      - name: Allocation reports name tags on a traced compiler
        if: steps.seed.outputs.seeded == 'yes'
        timeout-minutes: 20
        run: bash scripts/debugstream-stress/tag-reports.sh

      # A lane's `TargetIr` pins are minted on that lane's own host and compared against a COMPILE,
      # so a lane this runner cannot run is still compiled and compared (reported NOTRUN, which is
      # not a pass). Running every lane from a second and third host checks that a cross-compile's
      # output does not depend on the host that compiled it, and catches a pin another lane's change
      # left stale. Linux only: the harness runs a Linux target under WSL or OrbStack and refuses
      # without them, while a Linux host runs no foreign lane and only compiles and compares.
      - name: IR suite, the other native lanes
        if: steps.seed.outputs.seeded == 'yes' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          targets="$(./scripts/targets/matrix.sh list target native)"
          failed=0

          for target in $targets; do
            if [ "$target" = "${{ matrix.target }}" ]; then
              continue
            fi

            ./maxon-bin/.maxon/maxon spec-test ir-specs --target="$target" || failed=1
          done

          exit "$failed"

      - name: Test corpora
        if: steps.seed.outputs.seeded == 'yes'
        timeout-minutes: 240
        run: bash scripts/run-test-corpora.sh corpora

      - &leftovers
        name: No file left behind
        if: steps.seed.outputs.seeded == 'yes'
        run: |
          set -euo pipefail
          python=python3
          [ "$RUNNER_OS" != "Windows" ] || python=python
          "$python" scripts/check-ignored-files.py

      - &evidence
        name: Resource evidence
        if: failure() && steps.seed.outputs.seeded == 'yes'
        run: |
          tail -n 400 "$RUNNER_TEMP/resource-samples.log" || true

          case "$RUNNER_OS" in
            Linux)
              # `-n`: sudo fails at once rather than waiting for a password.
              { sudo -n dmesg -T || dmesg -T; } 2>&1 | grep -i -E 'out of memory|oom|killed process' | tail -n 40 || true
              ps -eo pid,ppid,pgid,stat,rss,etime,args --forest | cut -c1-240 || true
              ;;
            macOS)
              ps -axo pid,ppid,pgid,stat,rss,etime,args | cut -c1-240 | sort -k2,2n || true
              ;;
            Windows)
              echo "the process table is the last sample above"
              ;;
            *)
              echo "no process listing for $RUNNER_OS"
              ;;
          esac

      - &upload-samples
        name: Upload the resource samples
        if: failure() && steps.seed.outputs.seeded == 'yes'
        uses: actions/upload-artifact@v6
        with:
          name: resource-samples-${{ github.job }}-${{ matrix.target }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: ${{ runner.temp }}/resource-samples.log
          if-no-files-found: ignore

  tools:
    needs: targets
    strategy: *lanes
    runs-on: ${{ matrix.runner }}
    defaults: *bash-steps
    steps:
      - *checkout
      - *seed
      - *build
      - *sampler
      - *sampler-windows
      - *openssl
      - *vendorcache
      - *vendor

      # ⛔ **THE macOS LANE DEBUGS THROUGH APPLE'S `debugserver`, WHICH IS AUTHORIZED PER MACHINE AND NOT PER
      # PROCESS.** Without developer mode enabled every debug case on that lane is refused for want of
      # authorization, and the Xcode command line tools are where the stub itself comes from.
      - name: Authorize the debug stub
        if: steps.seed.outputs.seeded == 'yes' && matrix.debugger == 'yes' && runner.os == 'macOS'
        run: |
          set -euo pipefail
          xcode-select --print-path
          sudo /usr/sbin/DevToolsSecurity -enable
          /usr/sbin/DevToolsSecurity -status

      - name: Test corpora
        if: steps.seed.outputs.seeded == 'yes'
        timeout-minutes: 240
        run: bash scripts/run-test-corpora.sh tools

      - *leftovers

      - name: Processes the test corpora left running
        if: always() && steps.seed.outputs.seeded == 'yes' && matrix.debugger == 'yes'
        run: |
          case "$RUNNER_OS" in
            Windows)
              powershell -NoProfile -Command 'Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*maxon*" -or $_.CommandLine -like "*$env:GITHUB_WORKSPACE*" -or $_.Name -match "debugserver|gdbserver|lldb" } | Select-Object ProcessId, ParentProcessId, CreationDate, CommandLine | Format-Table -AutoSize | Out-String -Width 400' || true
              ;;
            Linux | macOS)
              ps -axo pid,ppid,pgid,stat,rss,etime,args | cut -c1-240 | grep -E "maxon|$GITHUB_WORKSPACE|debugserver|gdbserver|lldb" | grep -v grep || true
              ;;
            *)
              echo "no process listing for $RUNNER_OS"
              ;;
          esac

      - *evidence
      - *upload-samples

  # Each shard runs its share of both the whole suite and the reversed-order run: a job of their own
  # for the second would add a shard's worth of macOS jobs against the five GitHub Free allows.
  suite:
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.shards) }}
    runs-on: ${{ matrix.runner }}
    defaults: *bash-steps
    steps:
      - *checkout
      - *seed
      - *build
      - *sampler
      - *sampler-windows
      - *openssl
      - *vendorcache
      - *vendor

      - name: Suite
        if: steps.seed.outputs.seeded == 'yes'
        run: ./maxon-bin/.maxon/maxon spec-test --shard="${{ matrix.shard }}/$SUITE_SHARDS"

      - name: Suite in reversed source order
        if: steps.seed.outputs.seeded == 'yes'
        env:
          MAXON_SOURCE_ORDER: reversed
        run: >-
          ./maxon-bin/.maxon/maxon spec-test
          --shard="${{ matrix.shard }}/$SUITE_SHARDS"
          --filter=array-conditional-conformance-withheld/
          --filter=arrays/
          --filter=associated-type-held-at-an-interface/
          --filter=associated-types/
          --filter=borrow-liveness/
          --filter=bytearray-element-size/
          --filter=closure-param-type-inference/
          --filter=conditional-extensions/
          --filter=duplicate-functions/
          --filter=duplicate-typealias/
          --filter=end-labels/
          --filter=enum-hashable/
          --filter=enum-interface-conformance/
          --filter=export-keyword/
          --filter=extension-publication/
          --filter=first-class-functions/
          --filter=generic-functions/
          --filter=generic-opaque-cursor-element/
          --filter=generic-type-nested-array-typealias/
          --filter=generic-types/
          --filter=global-file-private-same-name/
          --filter=inner-alias-construction/
          --filter=interface-conformance/
          --filter=interface-dispatch/
          --filter=interface-extension-body-namespace/
          --filter=interface-extensions/
          --filter=interfaces/
          --filter=lazy-static/
          --filter=let-escape/
          --filter=lexer-edge-cases/
          --filter=lexer-parser-robustness/
          --filter=library-tier-surface/
          --filter=map/
          --filter=module-scope/
          --filter=nominal-function-alias/
          --filter=param-default-list-walks/
          --filter=param-default-refusals/
          --filter=per-instance-typealias/
          --filter=readonly-element-types/
          --filter=self-field-struct-typed/
          --filter=service-registry/
          --filter=services/
          --filter=set/
          --filter=signature-type-visibility/
          --filter=static-variables/
          --filter=test-declaration/
          --filter=top-level-let/
          --filter=tuples/
          --filter=type-name-collision/
          --filter=typealias-file-scope/
          --filter=where-clause-associated-binding/
          --filter=where-clauses/
          --filter=witness-by-reference/

      - *leftovers

      - *evidence
      - *upload-samples

  # One lane: its programs run under `vendor/wasmtime`, which `Stage vendor` stages, rather than on
  # the runner's OS, so no lane's host changes what they run on.
  cross-suite:
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.cross-shards) }}
    runs-on: ${{ matrix.runner }}
    defaults: *bash-steps
    steps:
      - *checkout
      - *seed
      - *build
      - *sampler
      - *sampler-windows
      - *openssl
      - *vendorcache
      - *vendor

      - name: Cross-target suites
        if: steps.seed.outputs.seeded == 'yes'
        run: |
          set -euo pipefail
          targets="$(./scripts/targets/matrix.sh list target cross)"
          for target in $targets; do
            ./maxon-bin/.maxon/maxon spec-test --target="$target" --shard="${{ matrix.shard }}/$SUITE_SHARDS"
          done

      - *leftovers

      - *evidence
      - *upload-samples
