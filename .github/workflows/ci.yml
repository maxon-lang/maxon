# Every push and pull request: build the compiler and run the whole suite, on all four targets.
#
# ⭐⭐ EACH TARGET IS BUILT AND TESTED ON ITS OWN ARCHITECTURE, for the release workflow's reason: a
# green matrix that cross-compiled three of its lanes reports coverage it never had.
#
# ⚠ THIS IS INERT UNTIL v0.1.0 EXISTS, AND SAYS SO RATHER THAN FAILING. Maxon compiles Maxon, so a
# runner needs a compiler before it can build one and takes the last published release. Until there is
# one, every job would fail on a condition no contributor can fix — so the seed step SKIPS the run and
# writes a notice instead. It becomes real the moment a release is published, with no edit here.

# ⭐ A COMMIT THAT TOUCHES NOTHING THIS WORKFLOW READS DOES NOT RUN IT. The build reads `maxon-bin/`,
# `stdlib/`, `runtime/`, `vendor/`, `project.maxon` and the scripts; the jobs read `specs/` and the
# four `tests/` corpora they run. Everything excluded below is read by none of them — prose, editor and
# agent config, and projects with workflows of their own. `tests/` and `examples/` are excluded because
# no job here runs the rest of them, so a run on their change reports on code it never touched; the
# four corpora are re-included because a job does run them.
#
# ⛔ THE LIST IS EXCLUSIONS, AND A RE-INCLUSION IS WRITTEN ONLY FOR A PATH A JOB READS. A new
# directory therefore runs CI until someone decides it need not, rather than being skipped silently
# until someone notices it should not be. ⚠ The last pattern matching a path wins, so a re-inclusion
# has to sit AFTER the exclusion it reopens — moved above it, it stops applying and nothing says so.
# `*.md` matches the ROOT only — `*` stops at a `/`, and `specs/*.md` is the suite itself.
#
# ⛔ IF THIS EVER BECOMES A REQUIRED STATUS CHECK, a path filter STOPS IT REPORTING AT ALL on a
# pull request it skips, which blocks the merge rather than passing it. This repository develops on
# `main` and has no branch protection today; a future one needs a different shape, not a wider filter.

name: ci

on:
  push:
    branches: [main]
    paths: &ci-inputs
      - '**'
      - '!website/**'
      - '!docs/**'
      - '!*.md'
      - '!**/AGENTS.md'
      - '!LICENSE-*'
      - '!todo.md'
      - '!.claude/**'
      - '!.agents/**'
      - '!.vscode/**'
      - '!.mcp.json'
      - '!.editorconfig'
      - '!.gitignore'
      - '!vscode-extension/**'
      - '!installer/**'
      - '!bench/**'
      - '!tests/**'
      - 'tests/lsp/**'
      - 'tests/fmt/**'
      - 'tests/ladders/**'
      - 'tests/spec-harness/**'
      - 'tests/debug/**'
      - 'tests/dap/**'
      - 'tests/mcp/**'
      - 'tests/cli/**'
      - 'tests/build-manifest/**'
      - '!examples/**'
      - '!.github/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths: *ci-inputs
  workflow_dispatch:

# ⭐ A PULL REQUEST CANCELS ITS OWN OLDER RUNS; `main` NEVER CANCELS. Superseding is right on a
# branch still being pushed to — the verdict anyone wants is about the commit that gets MERGED, and a
# run for an intermediate commit spends an hour of runner time on code that will not exist. It is
# wrong on `main`, where "which commit broke it" is the question this workflow is here to answer:
# cancelling commit N's run because N+1 landed is how a break becomes unattributable.
#
# ⚠ THE `run_id` FALLBACK IS WHAT TURNS CANCELLING OFF, and `cancel-in-progress: false` would not.
# A group is the thing that supersedes, and a group still discards a run while it is QUEUED — which a
# `main` run often is, because GitHub Free allows five concurrent macOS jobs and one run uses one.
# Giving each `main` run a group of its own is the only way it is left alone.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64-windows
            runner: windows-latest
            debugger: yes
          - target: x64-linux
            runner: ubuntu-latest
            debugger: yes
          - target: arm64-macos
            runner: macos-15
            debugger: yes
          - target: arm64-linux
            runner: ubuntu-24.04-arm
            debugger: yes
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # The seed is the binary alone; `scripts/fetch-seed.sh` says why and is the one place that fetches it.
      - name: Seed from the last release
        id: seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/fetch-seed.sh ${{ matrix.target }} --allow-none
          . scripts/lib/host-binaries.sh
          if [ -x "$(maxon_downloaded_path)" ]; then
            echo "seeded=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no published release to seed from yet — CI is inert until v0.1.0"
            echo "seeded=no" >> "$GITHUB_OUTPUT"
          fi

      # The seed builds `C1` and `C1` builds `C2`: one build would run the suite on the seed's runtime.
      - name: Build
        if: steps.seed.outputs.seeded == 'yes'
        run: ./scripts/build-from-seed.sh

      - name: Suite
        if: steps.seed.outputs.seeded == 'yes'
        run: ./maxon-bin/.maxon/maxon spec-test --rewrite-drifted-goldens

      # ⭐ IN THE MATRIX RATHER THAN IN A JOB OF ITS OWN, because this area is host-specific where
      # almost nothing else is: percent-decoding a uri, un-rooting a drive letter, and
      # `FilePath.equals` being case-insensitive on Windows alone. A single-host lane would leave
      # three hosts' path handling unexercised, and what it misses are wrong ANSWERS, not breaks.
      # Its cases wait out whole-project checks, and the busiest (120 sibling files) runs well past the
      # 5 s default deadline.
      - name: LSP corpus
        if: steps.seed.outputs.seeded == 'yes'
        run: ./maxon-bin/.maxon/maxon test tests/lsp --timeout=60000

      # These three are tree-level gates `spec-test` does not run.
      - name: Formatter corpus
        if: steps.seed.outputs.seeded == 'yes'
        run: ./maxon-bin/.maxon/maxon test tests/fmt

      # Its drift gate runs `spec-test` three times, within a second of the 5 s default deadline.
      - name: Spec harness corpus
        if: steps.seed.outputs.seeded == 'yes'
        run: ./maxon-bin/.maxon/maxon test tests/spec-harness --timeout=15000

      - name: Ladder index
        if: steps.seed.outputs.seeded == 'yes'
        run: ./maxon-bin/.maxon/maxon test tests/ladders

      - name: Build manifest corpus
        if: steps.seed.outputs.seeded == 'yes'
        run: ./maxon-bin/.maxon/maxon test tests/build-manifest --timeout=20000

      # ⭐ THE ONLY DEBUGGER CODE CI RUNS. `spec-test` covers the language; the debugger's driver, its
      # DAP server and its MCP tools are exercised by these three corpora and by nothing else, so a lane
      # without them reports a green suite over a debugger that does not start. `matrix.debugger` is the
      # lane's own answer to `BackendChoice.backendForHost`, written once beside the runner rather than
      # three times as a list of triples.
      #
      # ⛔ **THE macOS LANE DEBUGS THROUGH APPLE'S `debugserver`, WHICH IS AUTHORIZED PER MACHINE AND NOT PER
      # PROCESS.** Without developer mode enabled every debug case on that lane is refused for want of
      # authorization, and the Xcode command line tools are where the stub itself comes from.
      - name: Authorize the debug stub
        if: steps.seed.outputs.seeded == 'yes' && matrix.debugger == 'yes' && runner.os == 'macOS'
        run: |
          set -euo pipefail
          xcode-select --print-path
          sudo /usr/sbin/DevToolsSecurity -enable
          /usr/sbin/DevToolsSecurity -status

      - name: Debugger corpus
        if: steps.seed.outputs.seeded == 'yes' && matrix.debugger == 'yes'
        run: ./maxon-bin/.maxon/maxon test tests/debug --timeout=60000

      - name: DAP corpus
        if: steps.seed.outputs.seeded == 'yes' && matrix.debugger == 'yes'
        run: ./maxon-bin/.maxon/maxon test tests/dap --timeout=60000

      - name: MCP corpus
        if: steps.seed.outputs.seeded == 'yes' && matrix.debugger == 'yes'
        run: ./maxon-bin/.maxon/maxon test tests/mcp --timeout=60000

      # `tests/cli` builds wasm32-wasi from this checkout, and wrapping the core module into a
      # component needs `vendor/wasm-tools` (E6005 without it). `vendor/` is gitignored, so nothing
      # else stages it.
      - name: Stage vendor
        if: steps.seed.outputs.seeded == 'yes'
        run: ./scripts/fetch-vendor.sh ${{ matrix.target }}

      - name: CLI corpus
        if: steps.seed.outputs.seeded == 'yes'
        run: ./maxon-bin/.maxon/maxon test tests/cli

      # ⭐ THE FIXPOINT IS THE ONE CHECK A GREEN SUITE CANNOT STAND IN FOR. Every stage shares the
      # compiler's logic, so the suite exercises the same behaviour whichever stage ran it; only the
      # BYTES of two successive self-compiles say whether the emitted code is stable, and a difference
      # is a miscompile.
      - name: Fixpoint
        if: steps.seed.outputs.seeded == 'yes'
        run: ./scripts/fixpoint.sh

      # The suite writes a golden only for a case that passed on this runner, so what a red run
      # wrote is as valid as a green one's: this step runs after a red suite too, and fails only
      # when the suite changed something other than this lane's own goldens.
      - name: Goldens the suite wrote
        id: goldens
        if: always() && steps.seed.outputs.seeded == 'yes'
        run: |
          set -euo pipefail
          . scripts/lib/goldens.sh
          changes="$(goldens_stage_lane "$RUNNER_TEMP/goldens" ${{ matrix.target }})"
          if [ -z "$changes" ]; then
            echo "goldens=no" >> "$GITHUB_OUTPUT"
            echo "**Goldens:** ${{ matrix.target }} wrote none" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          while read -r kind path; do
            echo "::notice file=$path::${{ matrix.target }} wrote this golden ($kind); it is in the goldens-${{ matrix.target }} artifact"
          done <<< "$changes"
          echo "**Goldens:** $(printf '%s\n' "$changes" | goldens_tally)" >> "$GITHUB_STEP_SUMMARY"
          echo "goldens=yes" >> "$GITHUB_OUTPUT"

      - name: Upload the goldens
        if: always() && steps.goldens.outputs.goldens == 'yes'
        uses: actions/upload-artifact@v6
        with:
          name: goldens-${{ matrix.target }}
          path: ${{ runner.temp }}/goldens
          if-no-files-found: error

  # Commits every lane's goldens to `main`, red lanes included, for the reason above. A push made
  # with `GITHUB_TOKEN` starts no workflow run, so the recorded commit costs no second CI round. A
  # branch protection rule on `main` would refuse this push.
  #
  # ⛔ NO `concurrency` GROUP: a fixed group lets GitHub cancel a queued `main` run, which the group
  # at the top of this file exists to prevent. `scripts/record-goldens.sh` handles overlapping
  # recorders with its retry loop and its staleness guard.
  record-goldens:
    needs: suite
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.repository == 'maxon-lang/maxon' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download the goldens
        uses: actions/download-artifact@v6
        with:
          pattern: goldens-*
          path: ${{ runner.temp }}/goldens-in

      - name: Record the goldens on main
        run: ./scripts/record-goldens.sh "$GITHUB_SHA" "$RUNNER_TEMP/goldens-in"
