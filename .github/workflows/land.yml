# Land a branch on `main`. `scripts/land.sh` holds every step; `docs/RELEASING.md` owns the procedure.
# No concurrency group: a group replaces a pending run, which would drop a land. The push job's
# compare-and-swap push is the serialisation.

name: land
run-name: ${{ inputs.head && format('land {0} attempt {1}', inputs.head, inputs.attempt) || '' }}

on:
  push:
    branches: ['**', '!main']
  workflow_dispatch:
    inputs:
      mode:
        description: main lands the branch; rehearsal runs every step, publishes nothing that survives, and never pushes main
        required: true
        type: choice
        options: [rehearsal, main]
        default: rehearsal
      head:
        description: the full commit id this dispatch lands; the plan refuses the run when the branch has moved from it
        required: false
        type: string
        default: ''
      tip:
        description: rehearsal only (main mode refuses it) — a branch or full commit id that stands in for main's tip when the plan merges
        required: false
        type: string
        default: ''
      moved:
        description: rehearsal only (main mode refuses it) — a branch or full commit id that stands in for main's tip when the land job pushes
        required: false
        type: string
        default: ''
      attempt:
        description: which dispatch of this land this is; the land job dispatches the next when main moved by a seed input
        required: false
        type: string
        default: '1'

permissions:
  contents: read

env:
  LAND_BRANCH: ${{ github.ref_name }}
  LAND_RUN_HEAD: ${{ inputs.head || github.sha }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, format('{0}Land:', fromJSON('"\n"')))
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      kind: ${{ steps.plan.outputs.kind }}
      base: ${{ steps.plan.outputs.base }}
      tip: ${{ steps.plan.outputs.tip }}
      head: ${{ steps.plan.outputs.head }}
      native: ${{ steps.plan.outputs.native }}
      chain: ${{ steps.plan.outputs.chain }}
      committed: ${{ steps.plan.outputs.committed }}
      date: ${{ steps.plan.outputs.date }}
      landed: ${{ steps.plan.outputs.landed }}
      proof: ${{ steps.plan.outputs.proof }}
      tag: ${{ steps.plan.outputs.tag }}
      pin: ${{ steps.plan.outputs.pin }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify the branch, merge it at main's tip, prove the seed and mint the scale row
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          LAND_EVENT: ${{ github.event_name }}
          LAND_MODE: ${{ inputs.mode }}
          LAND_HEAD_INPUT: ${{ inputs.head }}
          LAND_TIP_INPUT: ${{ inputs.tip }}
          LAND_MOVED_INPUT: ${{ inputs.moved }}
          LAND_ATTEMPT: ${{ inputs.attempt || '1' }}
        run: ./scripts/land.sh plan "$GITHUB_SHA"

      - name: Hand the landed commit to the land job
        if: steps.plan.outputs.kind == 'ordinary'
        uses: actions/upload-artifact@v6
        with:
          name: landed
          path: temp/land-bundle/landed.bundle
          retention-days: 1
          if-no-files-found: error

  credential:
    needs: plan
    if: needs.plan.outputs.mode == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require the landing App's secrets
        env:
          LAND_APP_ID: ${{ secrets.LAND_APP_ID }}
          LAND_APP_PRIVATE_KEY: ${{ secrets.LAND_APP_PRIVATE_KEY }}
        run: |
          [ -n "$LAND_APP_ID" ] && [ -n "$LAND_APP_PRIVATE_KEY" ] \
            || { echo "::error::the repository secrets LAND_APP_ID and LAND_APP_PRIVATE_KEY are not set — docs/RELEASING.md, \"Repository secrets\""; exit 1; }

      - &mint-token
        name: Mint the token that pushes main
        id: app
        if: needs.plan.outputs.mode == 'main'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.LAND_APP_ID }}
          private-key: ${{ secrets.LAND_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

  chain:
    needs: plan
    if: needs.plan.outputs.kind == 'chain'
    runs-on: ubuntu-latest
    env: &plan-env
      LAND_MODE: ${{ needs.plan.outputs.mode }}
      LAND_KIND: ${{ needs.plan.outputs.kind }}
      LAND_BASE: ${{ needs.plan.outputs.base }}
      LAND_TIP: ${{ needs.plan.outputs.tip }}
      LAND_HEAD: ${{ needs.plan.outputs.head }}
      LAND_CHAIN: ${{ needs.plan.outputs.chain }}
      LAND_COMMITTED: ${{ needs.plan.outputs.committed }}
      LAND_DATE: ${{ needs.plan.outputs.date }}
      LAND_LANDED: ${{ needs.plan.outputs.landed }}
      LAND_TAG: ${{ needs.plan.outputs.tag }}
      LAND_PIN: ${{ needs.plan.outputs.pin }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build the bootstrap chain and freeze the seed from its last compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/land.sh freeze

      - uses: actions/upload-artifact@v6
        with:
          name: seed
          path: temp/seed/dist
          retention-days: 1
          if-no-files-found: error

  prove:
    needs: [plan, chain]
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.native) }}
    runs-on: ${{ matrix.runner }}
    env: *plan-env
    steps:
      - name: Let git check out paths past 260 characters
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.head }}

      - uses: actions/download-artifact@v7
        with:
          name: seed
          path: temp/seed/dist

      - name: Build the tree with the frozen seed
        run: ./scripts/land.sh prove "${{ matrix.target }}"

  publish:
    needs: [plan, credential, prove]
    if: >-
      needs.plan.outputs.kind == 'chain' && !cancelled() && needs.prove.result == 'success'
      && (needs.plan.outputs.mode == 'rehearsal' || needs.credential.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env: *plan-env
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: seed
          path: temp/seed/dist

      - name: Publish the seed, its tag and its chain ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/land.sh publish

  land:
    needs: [plan, credential, publish]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && ((needs.plan.outputs.kind == 'ordinary' && (needs.plan.outputs.mode == 'rehearsal' || needs.credential.result == 'success'))
      || (needs.plan.outputs.kind == 'chain' && needs.plan.outputs.mode == 'main' && needs.credential.result == 'success' && needs.publish.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      redispatched: ${{ steps.land.outputs.redispatched }}
    env: *plan-env
    steps:
      - *mint-token

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}

      - uses: actions/download-artifact@v7
        if: needs.plan.outputs.kind == 'ordinary'
        with:
          name: landed
          path: temp/land-bundle

      - name: Push main, merging again if it moved
        id: land
        env:
          GH_TOKEN: ${{ github.token }}
          LAND_TIP_INPUT: ${{ inputs.tip }}
          LAND_MOVED_INPUT: ${{ inputs.moved }}
          LAND_ATTEMPT: ${{ inputs.attempt || '1' }}
        run: ./scripts/land.sh land

      - name: Keep the commit a rehearsal would push
        if: needs.plan.outputs.mode == 'rehearsal' && steps.land.outputs.redispatched != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: would-push
          path: temp/land-bundle/would-push.bundle
          retention-days: 1
          if-no-files-found: error

  retract:
    needs: [plan, chain, prove, credential, publish, land]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.kind == 'chain'
      && (needs.plan.outputs.mode == 'rehearsal' || needs.land.result != 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env: *plan-env
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Retract what this run published, unless main holds its pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/land.sh retract

  consume:
    needs: [plan, chain, prove, credential, publish, land, retract]
    if: >-
      always() && needs.plan.result != 'skipped' && needs.land.outputs.redispatched != 'true'
      && startsWith(github.ref, 'refs/heads/') && github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Delete the run's branch unless it was pushed again
        run: ./scripts/land.sh consume
