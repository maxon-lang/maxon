# Update the Homebrew tap when a release is published.
#
# ⭐ THE FORMULA IS GENERATED FROM THE PUBLISHED ASSETS, NOT FROM THE TREE. It carries the SHA256 of
# the archive people will actually download, so it is computed from the file the release serves rather
# than from a local build that merely ought to match it.
#
# ⚠ IT PUSHES TO ANOTHER REPOSITORY, WHICH `GITHUB_TOKEN` CANNOT DO. `secrets.TAP_TOKEN` must be a PAT
# with write access to `maxon-lang/homebrew-tap`. Without it the job SKIPS with a warning rather than
# failing the release: a red mark on every release until someone adds a secret teaches people to
# ignore red marks.

name: homebrew

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without the leading v)'
        required: true

permissions:
  contents: read

jobs:
  tap:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishing formula for $version"

      # The generator reads the archives out of dist/, exactly as it does locally — one implementation
      # of "how a formula is built", not a second copy living in this file.
      - name: Fetch the macOS archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "v${{ steps.v.outputs.version }}" --pattern '*arm64-macos.tar.gz' --dir dist
          ls -la dist/

      - name: Generate the formula
        run: ./installer/homebrew/generate.sh "${{ steps.v.outputs.version }}"

      - name: Push it to the tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::no TAP_TOKEN secret — skipping. Commit dist/homebrew/maxon.rb to maxon-lang/homebrew-tap as Formula/maxon.rb by hand."
            exit 0
          fi
          git clone --quiet "https://x-access-token:${TAP_TOKEN}@github.com/maxon-lang/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/homebrew/maxon.rb tap/Formula/maxon.rb
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ⚠ NOTHING TO COMMIT IS A SUCCESS, NOT A FAILURE — re-running a release must be harmless.
          if git diff --quiet; then
            echo "formula already current"
            exit 0
          fi
          git add Formula/maxon.rb
          git commit -m "maxon ${{ steps.v.outputs.version }}"
          git push
          echo "pushed maxon ${{ steps.v.outputs.version }} to the tap"
