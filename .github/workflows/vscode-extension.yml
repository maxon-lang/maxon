# Test the VS Code extension on every change to it, and publish it when a release is published.
#
# ⭐⭐ THE SUITE IS HERE BECAUSE `ci.yml` EXCLUDES `vscode-extension/**` — deliberately, since nothing
# there runs the extension. So this is the only workflow that can run it, and a language feature the
# extension is the client for can be lost with every other lane green.
#
# ⭐ TWO REGISTRIES, ONE ARTIFACT. The same `.vsix` goes to the VS Code Marketplace and to Open VSX,
# which is what VSCodium, Cursor and Windsurf install from. Building it twice would risk publishing two
# different files under one version.
#
# ⚠ IT RUNS ONCE THE RELEASE IS PUBLISHED, NOT ON A TAG — started by `release.yml`'s `publish` job, or
# by `release: published` for a release published by hand. The extension's not-found flow runs the
# install script, which installs the newest published release — so publishing the extension before its
# release exists would install the compiler before it.
#
# ⛔ NEITHER SECRET IS CREATED BY THIS FILE, AND IT FAILS CLEANLY WITHOUT THEM. `VSCE_PAT` is being
# deprecated in favour of Entra federated credentials (Microsoft removes global PATs on 2026-12-01), so
# the marketplace step prefers `--azure-credential` when the repo is configured for it.

name: vscode-extension

on:
  # ⭐ THE SUITE RUNS ON EVERY CHANGE TO THE EXTENSION OR TO THE SERVER IT DRIVES, WHICH THE PUBLISH
  # DOES NOT. The extension has no code of its own for a language feature — it forwards to the
  # compiler's LSP — so a change under `maxon-bin/Compiler/Lsp/` is a change to what these tests
  # assert. `stdlib/Print.maxon` is named because the cross-file definition case pins that path.
  push:
    branches: [main]
    paths: &extension-inputs
      - 'vscode-extension/**'
      - 'maxon-bin/Compiler/Lsp/**'
      - 'stdlib/Print.maxon'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    paths: *extension-inputs
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      # From a ref past the release that carries an extension change, the default baseline already
      # contains it and the gate says `skip`; `since` names an earlier release so it still publishes.
      since:
        description: Release tag to compare the extension against (default the newest release before the ref)
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

# A pull request supersedes its own older runs; `main` and a release never cancel — `ci.yml` states why.
concurrency:
  group: vscode-extension-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # ⭐⭐ THE SERVER UNDER TEST IS THIS TREE'S COMPILER, WHICH IS WHY THIS JOB BUILDS ONE. The extension
  # is a client: every assertion about a language feature is an assertion about `maxon lsp-server`, so a
  # suite run against a released compiler would report on code this commit did not change. `runTest.ts`
  # pins the search to `maxon-bin/.maxon/` and refuses to run without it.
  #
  # ⚠ `xvfb-run`, because the suite launches a real VS Code and a Linux runner has no display.
  suite:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v5

      # `ci.yml`'s seed step, for its reason: Maxon compiles Maxon, so a runner takes the last
      # published release to build this tree with — and until one exists there is nothing to build.
      - name: Seed from the last release
        id: seed
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/fetch-seed.sh --allow-none
          . scripts/lib/host-binaries.sh
          if [ -x "$(maxon_downloaded_path)" ]; then
            echo "seeded=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no published release to seed from yet — the extension suite is inert until v0.1.0"
            echo "seeded=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the compiler that serves the tests
        if: steps.seed.outputs.seeded == 'yes'
        working-directory: .
        run: ./scripts/build-from-seed.sh

      - uses: actions/setup-node@v5
        if: steps.seed.outputs.seeded == 'yes'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - if: steps.seed.outputs.seeded == 'yes'
        run: npm ci

      # The grammar snapshots and the end-to-end suite, which is what `npm test` is.
      - name: Suite
        if: steps.seed.outputs.seeded == 'yes'
        run: xvfb-run -a npm test

  publish:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ⭐⭐ **A RELEASE THAT DID NOT CHANGE THE EXTENSION PUBLISHES NOTHING.** This workflow fires on
      # every published release, and `vsce` refuses to republish an existing version — so without this
      # the ordinary case (measured: 0 of the 21 commits since v0.1.0 touch `vscode-extension/`) is a
      # red mark on a release that did nothing wrong. The gate refuses the genuinely broken case
      # instead: changed, but the version was not bumped. `release.yml`'s `guard` asks the same
      # question before any runner starts, so reaching here with that answer should be impossible.
      #
      # ⚠ `fetch-depth: 0` is what lets it compare against the previous tag at all.
      - name: Does this release publish the extension?
        id: gate
        working-directory: .
        env:
          SINCE: ${{ inputs.since }}
        run: echo "decision=$(./scripts/extension-release-gate.sh $SINCE)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - if: steps.gate.outputs.decision == 'publish'
        run: npm ci

      # ⚠ PACKAGED ONCE, PUBLISHED TWICE. Both registries get the identical file.
      - name: Package
        if: steps.gate.outputs.decision == 'publish'
        run: npx @vscode/vsce package --no-dependencies --out extension.vsix

      - uses: actions/upload-artifact@v6
        if: steps.gate.outputs.decision == 'publish'
        with:
          name: vsix
          path: vscode-extension/extension.vsix

      - name: Publish to the VS Code Marketplace
        if: steps.gate.outputs.decision == 'publish'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          # ⛔ A MISSING SECRET IS A FAILURE HERE, NOT A WARNING. This step runs only when the gate has
          # already decided the extension MUST be published, so skipping it would silently leave the
          # marketplace on an old version of an extension whose install flow points at a release that
          # has moved on.
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::error title=No VSCE_PAT::the extension changed and must be published, but there is no VSCE_PAT secret. Set one, or publish by hand with: npx @vscode/vsce publish --azure-credential --packagePath extension.vsix"
            exit 1
          fi
          npx @vscode/vsce publish --packagePath extension.vsix

      - name: Publish to Open VSX
        if: steps.gate.outputs.decision == 'publish'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::error title=No OVSX_PAT::the extension changed and must be published, but there is no OVSX_PAT secret. VSCodium, Cursor and Windsurf install from Open VSX and would stay on the old version."
            exit 1
          fi
          npx ovsx publish extension.vsix -p "$OVSX_PAT"
