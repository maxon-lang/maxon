# Publish the Maxon image to ghcr.io/maxon-lang/maxon when a release is published — started by
# `release.yml`'s `publish` job, or by `release: published` for a release published by hand. A change
# to the Dockerfile or this file builds and tests both variants against the latest release, and pushes
# nothing.
#
# Tags, for release X.Y.Z (X only from 1.0, since a 0.x major promises nothing):
#   debian      X.Y.Z  X.Y  X  latest
#   distroless  X.Y.Z-distroless  X.Y-distroless  X-distroless  distroless
# `latest` and `distroless` move only when X.Y.Z is the newest release, so republishing an old one
# never rolls them back.
#
# ⭐ EACH ARCHITECTURE IS BUILT ON ITS OWN RUNNER, NOT UNDER QEMU. The image build runs the compiler
# (to warm the standard library's cache), and each image is tested before anything is pushed.
#
# ⚠ GHCR creates a new package PRIVATE. After the first push, make `maxon` public once, in the
# organisation's package settings; `docker pull` without a login is what the install page promises.

name: docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without the leading v); empty takes it from the tag the run is on'
        required: false
  push:
    branches: [main]
    paths: ['installer/docker/**', '.github/workflows/docker.yml']
  pull_request:
    paths: ['installer/docker/**', '.github/workflows/docker.yml']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/maxon-lang/maxon

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      latest: ${{ steps.plan.outputs.latest }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          newest="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          newest="${newest#v}"
          if [ -n "$REQUESTED_VERSION" ]; then
            version="$REQUESTED_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$newest"
          fi
          case "$EVENT" in
            release|workflow_dispatch) publish=yes ;;
            *)                         publish=no ;;
          esac
          latest=no
          [ "$version" = "$newest" ] && latest=yes
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "version $version, publish $publish, newest release $newest"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        variant: [debian, distroless]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build it into the local image store
        uses: docker/build-push-action@v6
        with:
          context: installer/docker
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ env.VERSION }}
          load: true
          tags: maxon-test:${{ matrix.variant }}

      # As a user would run it: the image's own PATH, a project mounted at /app, and an unprivileged
      # user, so a read-only /opt/maxon is part of what is tested.
      - name: It reports the release and compiles and runs a program as an unprivileged user
        run: |
          set -euo pipefail
          image="maxon-test:${{ matrix.variant }}"
          reported="$(docker run --rm "$image" maxon version)"
          echo "$reported"
          case "$reported" in
            "maxon $VERSION "*) ;;
            *) echo "::error::expected maxon $VERSION"; exit 1 ;;
          esac
          work="$(mktemp -d)"
          chmod 777 "$work"
          cp examples/hello.maxon "$work/"
          docker run --rm --user 1000:1000 -v "$work:/app" "$image" maxon build hello.maxon -o hello
          [ "$("$work/hello")" = "Hello, world!" ]
          out="$(docker run --rm --user 1000:1000 "$image" maxon run /opt/maxon/examples/hello.maxon)"
          [ "$out" = "Hello, world!" ] || { echo "::error::maxon run printed '$out'"; exit 1; }
          # `maxon upgrade` reads this to point at the newest image of this variant instead of installing.
          newest="latest"
          [ "${{ matrix.variant }}" = "debian" ] || newest="${{ matrix.variant }}"
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$image" | grep -qx "MAXON_IMAGE=$IMAGE:$newest"

      - name: Log in to GHCR
        if: needs.plan.outputs.publish == 'yes'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The same build again, from the cache the first one filled, pushed by digest; `merge` names it.
      - name: Push it by digest
        id: push
        if: needs.plan.outputs.publish == 'yes'
        uses: docker/build-push-action@v6
        with:
          context: installer/docker
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ env.VERSION }}
          labels: org.opencontainers.image.version=${{ env.VERSION }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest
        if: needs.plan.outputs.publish == 'yes'
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - uses: actions/upload-artifact@v6
        if: needs.plan.outputs.publish == 'yes'
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  merge:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'yes'
    strategy:
      matrix:
        variant: [debian, distroless]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: digest-${{ matrix.variant }}-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tag the multi-architecture image
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          LATEST: ${{ needs.plan.outputs.latest }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          suffix=""
          [ "$VARIANT" = "debian" ] || suffix="-$VARIANT"
          major="${VERSION%%.*}"
          minor="${VERSION#*.}"; minor="${minor%%.*}"
          tags=("$VERSION$suffix" "$major.$minor$suffix")
          [ "$major" = "0" ] || tags+=("$major$suffix")
          if [ "$LATEST" = "yes" ]; then
            if [ "$VARIANT" = "debian" ]; then tags+=("latest"); else tags+=("$VARIANT"); fi
          fi
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$IMAGE:$tag"); done
          sources=()
          for digest in digests/*; do sources+=("$IMAGE@sha256:$(basename "$digest")"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION$suffix"

  # What a user pulls, by the tag they would use, on both architectures.
  verify:
    needs: [plan, merge]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Both variants run by their published tags
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          for tag in "$VERSION" "$VERSION-distroless"; do
            reported="$(docker run --rm "$IMAGE:$tag" maxon version)"
            echo "$tag: $reported"
            case "$reported" in "maxon $VERSION "*) ;; *) echo "::error::$tag reports '$reported'"; exit 1 ;; esac
          done
