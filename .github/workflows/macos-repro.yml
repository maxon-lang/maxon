name: macos-repro

on:
  workflow_dispatch:
  push:
    branches: [debug/macos-crash-repro]

permissions:
  contents: read

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: macos-15
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Seed from the last release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-seed.sh arm64-macos

      - name: Build
        run: ./scripts/build-from-seed.sh

      - name: Suite 1
        if: always()
        run: ./.github/suite-once.sh 1 ${{ matrix.shard }}

      - name: Suite 2
        if: always()
        run: ./.github/suite-once.sh 2 ${{ matrix.shard }}

      - name: Suite 3
        if: always()
        run: ./.github/suite-once.sh 3 ${{ matrix.shard }}

      - name: Suite 4
        if: always()
        run: ./.github/suite-once.sh 4 ${{ matrix.shard }}

      - name: Suite 5
        if: always()
        run: ./.github/suite-once.sh 5 ${{ matrix.shard }}

      - name: Suite 6
        if: always()
        run: ./.github/suite-once.sh 6 ${{ matrix.shard }}

      - name: Upload the crash logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-repro2-shard${{ matrix.shard }}
          path: crash-*.log
          if-no-files-found: ignore
