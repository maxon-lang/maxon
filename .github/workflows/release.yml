# Build, test and publish a release — one job per target, each on its own architecture.
#
# ⭐⭐ EVERY TARGET IS BUILT AND ITS WHOLE SUITE RUN ON THE ARCHITECTURE IT SHIPS FOR. Cross-compiling
# from one host and marking three lanes SKIP produces four archives and one tested compiler; this
# produces four tested compilers. The one thing worse than not testing arm64 is believing you did.
#
# ⚠ THE SEED IS THE PREVIOUS RELEASE. Maxon compiles Maxon, so each runner needs a compiler before it
# can build one, and it takes the last published release for its own target. That makes v0.1.0 the
# base case this workflow CANNOT serve: there is nothing to seed from, so its four archives are built
# and tested by hand and published without it. From v0.1.1 the chain is self-sustaining.
#
# `gh` is used here and nowhere else. It is preinstalled on every GitHub runner with a token already
# in the environment — a CI convenience, not a dependency this project asks a contributor to install.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ⛔ A RELEASE IS IDENTIFIED BY THE REF, AND THIS IS WHERE THAT IS ENFORCED. `build.maxon` derives
  # the version from git — a `vX.Y.Z` tag or a `release/X.Y.Z` branch, anything else `dev` — and
  # `release.sh --publish` refuses a tag that disagrees with what the binary reports. Both checks are
  # right and both are LATE: they fire after four runners have spent twenty minutes each building and
  # suite-testing a compiler that was never going to be publishable, and the second one fires after
  # the packaging it invalidates.
  #
  # ⚠ THE HOLE IT CLOSES IS `workflow_dispatch`, which can be aimed at ANY ref — `main` included.
  # The tag trigger is only `v*`, which `vfoo` also matches, so a push is not self-validating either.
  guard:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.ref.outputs.publish }}
    steps:
      # ⭐ A RELEASE BRANCH BUILDS BUT DOES NOT PUBLISH. It is where a release is rehearsed — four
      # targets built and their suites run — and there is no tag to name the result, so publishing from
      # one could only invent a version. The tag is what turns a rehearsal into a release.
      - name: Refuse a ref that is not a release
        id: ref
        run: |
          set -euo pipefail
          ref='${{ github.ref }}'
          if printf '%s' "$ref" | grep -Eq '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "publish=yes" >> "$GITHUB_OUTPUT"
            echo "$ref is a release tag: building and publishing."
          elif printf '%s' "$ref" | grep -Eq '^refs/heads/release/[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "publish=no" >> "$GITHUB_OUTPUT"
            echo "$ref is a release branch: building and testing, publishing nothing."
          else
            echo "::error title=Not a release ref::$ref is neither a vX.Y.Z tag nor a release/X.Y.Z branch. A compiler built here reports its version as 'dev', so there is nothing to release. Cut a release/X.Y.Z branch or push a vX.Y.Z tag."
            exit 1
          fi

      - uses: actions/checkout@v5
        if: steps.ref.outputs.publish == 'yes'
        with:
          fetch-depth: 0

      # ⭐⭐ **A RELEASE NOBODY WROTE AN ENTRY FOR MUST NOT SHIP.** `CHANGELOG.md` is written by hand,
      # so its failure mode is not rot but absence — and the release notes, the maxon.dev post and the
      # site's changelog page are all read out of it. Asking here means the answer arrives before four
      # runners spend twenty minutes each, which is the same reason the ref check above is in this job.
      # `release.sh --publish` asks again at the last moment.
      - name: The changelog has an entry for this release
        if: steps.ref.outputs.publish == 'yes'
        run: ./scripts/changelog.sh --section="${GITHUB_REF_NAME#v}" >/dev/null

      # ⛔ **AN EXTENSION THAT CHANGED WITHOUT ITS VERSION BEING BUMPED FAILS AT THE LAST STEP OF A
      # RELEASE** — `vsce` refuses to republish a version, and by then the compiler is published and the
      # tag is public. Asking here means the answer arrives before anything is uploaded. Nothing
      # changing under `vscode-extension/` is the ordinary case and passes.
      - name: The extension can be published if it needs to be
        if: steps.ref.outputs.publish == 'yes'
        run: ./scripts/extension-release-gate.sh >/dev/null

  package:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64-windows
            runner: windows-latest
          - target: x64-linux
            runner: ubuntu-latest
          - target: arm64-macos
            runner: macos-15
          - target: arm64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # ⚠ EVERY MATRIX LEG ANSWERS THE SAME QUESTION ("is there a release to seed from?"), so which leg
    # writes this is immaterial. The downstream jobs read it rather than re-asking, which keeps one
    # answer for the whole run.
    outputs:
      seeded: ${{ steps.seed.outputs.seeded }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # ⛔ THE SEED IS THE BINARY ALONE. A release archive ships its own `stdlib/` and `runtime/`, and the
      # compiler resolves both by walking UP from its own executable — so an archive unpacked whole would
      # leave a RELEASED stdlib and runtime one directory above the seed and this checkout's own would
      # never be read. The build would succeed and compile the wrong sources, silently.
      - name: Seed from the previous release
        id: seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ⛔ NO RELEASES AT ALL IS THE BOOTSTRAP CASE AND IS NOT A FAILURE. It happens exactly once,
          # for the first release, whose archives are built by hand — so it SKIPS with a notice rather
          # than going red. A red mark on the very release that introduces the workflow teaches people
          # to ignore red marks, which is the reason the tap job skips too.
          #
          # ⚠ It is NOT the same as "releases exist but none serves this target" — that IS a failure and
          # still errors below, because it means the chain broke somewhere it was supposed to hold.
          prev="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)"
          if [ -z "$prev" ]; then
            echo "::notice::no published release to seed from yet — v0.1.0's archives are built and published by hand (see this file's header)"
            echo "seeded=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "seeded=yes" >> "$GITHUB_OUTPUT"
          echo "seeding from $prev"
          work="$(mktemp -d)"
          gh release download "$prev" --pattern "*${{ matrix.target }}*" --dir "$work"
          archive="$(find "$work" -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | head -n1)"
          [ -n "$archive" ] || { echo "::error::$prev publishes no archive for ${{ matrix.target }}"; exit 1; }
          case "$archive" in
            *.zip)    unzip -q "$archive" -d "$work/x" ;;
            *.tar.gz) mkdir -p "$work/x" && tar -xzf "$archive" -C "$work/x" ;;
          esac
          mkdir -p .bootstrap
          found="$(find "$work/x" -type f -name 'maxon' -o -type f -name 'maxon.exe' | head -n1)"
          [ -n "$found" ] || { echo "::error::no maxon binary in $prev's ${{ matrix.target }} archive"; exit 1; }
          cp "$found" ".bootstrap/$(basename "$found")"
          chmod +x .bootstrap/*

      # The seed builds `C1` and `C1` builds `C2`: one build would run the suite on the seed's runtime.
      - name: Build
        if: steps.seed.outputs.seeded == 'yes'
        run: ./scripts/build-from-seed.sh

      # The suite runs inside --package, before the archive exists: a packaged compiler nobody ran is
      # a claim, and this is the step that makes it a fact.
      - name: Package (runs the suite first)
        if: steps.seed.outputs.seeded == 'yes'
        run: ./scripts/release.sh --package

      # ⭐ THE ONE PLACE `maxon upgrade`'s SUCCESS PATH RUNS BEFORE A RELEASE: `tests/cli` spawns `dev`
      # builds, and this is the versioned compiler about to ship, laid out as the install script lays it
      # out — `stdlib/` and `runtime/` beside `bin/`, which is where the compiler's walk finds them. A dry
      # run, so nothing is downloaded; it must name the probe's own root and the script.
      - name: maxon upgrade --dry-run recognises a script install
        if: steps.seed.outputs.seeded == 'yes'
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/upgrade-probe"
          mkdir -p "$probe/bin"
          cp maxon-bin/.maxon/maxon* "$probe/bin/"
          rm -f "$probe"/bin/*.mxdbg "$probe"/bin/*.previous*
          cp -R stdlib "$probe/stdlib"
          cp -R runtime "$probe/runtime"
          out="$("$probe/bin/maxon" upgrade --dry-run)"
          echo "$out"
          case "$out" in *"install root: "*"upgrade-probe"*) ;; *) echo "::error::the dry run did not name the probe's root"; exit 1 ;; esac
          case "$out" in *"maxon.dev/install"*) ;; *) echo "::error::the dry run did not name the install script"; exit 1 ;; esac

      - uses: actions/upload-artifact@v6
        if: steps.seed.outputs.seeded == 'yes'
        with:
          name: maxon-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      # ⛔ A RED SUITE IS EXACTLY WHEN THE LOG IS WORTH HAVING, and it is the one case the upload above
      # never reaches. `release.sh` writes `dist/spec-test-<target>.log` and then FAILS the step, so
      # without this the only record of which cases went red dies with the runner.
      - name: Keep the suite log when it fails
        if: failure() && steps.seed.outputs.seeded == 'yes'
        uses: actions/upload-artifact@v6
        with:
          name: spec-test-log-${{ matrix.target }}
          path: dist/spec-test-*.log
          if-no-files-found: ignore

  publish:
    needs: [guard, package]
    # ⛔ THE TAG IS THE ONLY THING THAT PUBLISHES. A release-branch run has reached this point having
    # built and tested everything, which is the whole point of rehearsing one — and stops here.
    if: needs.package.outputs.seeded == 'yes' && needs.guard.outputs.publish == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: staged

      - name: Collect the archives
        run: |
          set -euo pipefail
          mkdir -p dist
          find staged -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          ls -la dist/

      # ⭐⭐ **THE VERSION IS READ OFF A COMPILER, SO THIS JOB HAS TO HAVE ONE.** `release.sh` asks the
      # binary what version it is (`maxon version`) and refuses a tag that disagrees — so a publish
      # that was simply TOLD the version would delete the one check the whole scheme rests on.
      #
      # ⛔ **IT MUST BE THIS RELEASE'S OWN COMPILER, NOT THE PREVIOUS RELEASE'S.** `package` seeds from
      # the last published release because it needs something that can BUILD; this job needs something
      # that can ANSWER, and last release's binary answers with last release's number — which
      # `release.sh` would then correctly refuse. The x64-linux archive sitting in `dist/` was built
      # from this very tag, so the compiler inside it is the one whose word is being taken.
      #
      # ⚠ The glob avoids naming a version this step has no business knowing, and the binary lands
      # under `maxon-bin/` rather than in `dist/`, which the checksum sweep walks.
      - name: Seed the compiler from this release's own archive
        run: |
          set -euo pipefail
          archive="$(find dist -maxdepth 1 -type f -name 'maxon-*-x64-linux.tar.gz' | head -n1)"
          [ -n "$archive" ] || { echo "::error::no x64-linux archive in dist/ to read the version from"; exit 1; }
          work="$(mktemp -d)"
          tar -xzf "$archive" -C "$work"
          binary="$(find "$work" -type f -name maxon | head -n1)"
          [ -n "$binary" ] || { echo "::error::no maxon binary inside $archive"; exit 1; }
          mkdir -p maxon-bin/.maxon
          cp "$binary" maxon-bin/.maxon/maxon
          chmod +x maxon-bin/.maxon/maxon
          echo "seeded $(./maxon-bin/.maxon/maxon version)"

      # ⛔ THE TAG AND THE BINARIES MUST NAME ONE VERSION. `release.sh --publish` refuses when the tag
      # disagrees with what the compiler reports, which is the check that keeps the archives, the
      # Homebrew formula and the install page from naming different releases.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh --publish "${GITHUB_REF_NAME}"

      # ⛔ **A RELEASE THIS JOB CREATES FIRES NO `release: published`.** GitHub starts no workflow from
      # an event `GITHUB_TOKEN` caused, `workflow_dispatch` excepted — MEASURED on v0.1.1: published,
      # and the website, Homebrew and extension workflows never ran. So this job starts them, at the
      # tag, which is where each reads its version and its tree. Their own `release: published`
      # trigger is for a release published by hand, which does fire it.
      - name: Start what a published release updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in website.yml homebrew.yml docker.yml vscode-extension.yml install-script.yml; do
            gh workflow run "$workflow" --ref "$GITHUB_REF_NAME"
          done

      # ⛔ **THE TAG IS THE RECORD OF WHAT SHIPPED, SO THE BRANCH IT WAS CUT ON GOES.** A later commit on
      # `release/X.Y.Z` would describe a release that never existed, and `release.yml` would build and
      # test it at the real version. The tag names the same commit and the `Release tags` ruleset makes
      # every `v*` tag immutable, so deleting the branch loses nothing.
      #
      # ⚠ ONLY WHEN THE BRANCH TIP IS THE TAGGED COMMIT. A commit past the tag is work nothing shipped, and
      # deleting the branch would strand it — so that fails loudly and leaves the branch for a person.
      - name: Retire the release branch
        run: |
          set -euo pipefail
          branch="release/${GITHUB_REF_NAME#v}"
          tip="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          if [ -z "$tip" ]; then
            echo "::notice::no $branch to retire"
            exit 0
          fi
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error title=Release branch moved past the tag::$branch is at $tip but $GITHUB_REF_NAME is $GITHUB_SHA. Merge what is past the tag into main, then delete the branch by hand."
            exit 1
          fi
          git push origin --delete "$branch"
