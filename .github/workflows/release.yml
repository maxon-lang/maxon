# Build, test and publish a release — one job per target, each on its own architecture.
#
# ⭐⭐ EVERY TARGET IS BUILT AND ITS WHOLE SUITE RUN ON THE ARCHITECTURE IT SHIPS FOR. Cross-compiling
# from one host and marking three lanes SKIP produces four archives and one tested compiler; this
# produces four tested compilers. The one thing worse than not testing arm64 is believing you did.
#
# ⚠ THE SEED IS THE PREVIOUS RELEASE. Maxon compiles Maxon, so each runner needs a compiler before it
# can build one, and it takes the last published release for its own target. That makes v0.1.0 the
# base case this workflow CANNOT serve: there is nothing to seed from, so its four archives are built
# and tested by hand and published without it. From v0.1.1 the chain is self-sustaining.
#
# `gh` is used here and nowhere else. It is preinstalled on every GitHub runner with a token already
# in the environment — a CI convenience, not a dependency this project asks a contributor to install.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ⛔ A RELEASE IS IDENTIFIED BY THE REF, AND THIS IS WHERE THAT IS ENFORCED. `build.maxon` derives
  # the version from git — a `vX.Y.Z` tag or a `release/X.Y.Z` branch, anything else `dev` — and
  # `release.sh --publish` refuses a tag that disagrees with what the binary reports. Both checks are
  # right and both are LATE: they fire after four runners have spent twenty minutes each building and
  # suite-testing a compiler that was never going to be publishable, and the second one fires after
  # the packaging it invalidates.
  #
  # ⚠ THE HOLE IT CLOSES IS `workflow_dispatch`, which can be aimed at ANY ref — `main` included.
  # The tag trigger is only `v*`, which `vfoo` also matches, so a push is not self-validating either.
  guard:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.ref.outputs.publish }}
    steps:
      # ⭐ A RELEASE BRANCH BUILDS BUT DOES NOT PUBLISH. It is where a release is rehearsed — four
      # targets built and their suites run — and there is no tag to name the result, so publishing from
      # one could only invent a version. The tag is what turns a rehearsal into a release.
      - name: Refuse a ref that is not a release
        id: ref
        run: |
          set -euo pipefail
          ref='${{ github.ref }}'
          if printf '%s' "$ref" | grep -Eq '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "publish=yes" >> "$GITHUB_OUTPUT"
            echo "$ref is a release tag: building and publishing."
          elif printf '%s' "$ref" | grep -Eq '^refs/heads/release/[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "publish=no" >> "$GITHUB_OUTPUT"
            echo "$ref is a release branch: building and testing, publishing nothing."
          else
            echo "::error title=Not a release ref::$ref is neither a vX.Y.Z tag nor a release/X.Y.Z branch. A compiler built here reports its version as 'dev', so there is nothing to release. Cut a release/X.Y.Z branch or push a vX.Y.Z tag."
            exit 1
          fi

  package:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64-windows
            runner: windows-latest
          - target: x64-linux
            runner: ubuntu-latest
          - target: arm64-macos
            runner: macos-15
          - target: arm64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # ⚠ EVERY MATRIX LEG ANSWERS THE SAME QUESTION ("is there a release to seed from?"), so which leg
    # writes this is immaterial. The downstream jobs read it rather than re-asking, which keeps one
    # answer for the whole run.
    outputs:
      seeded: ${{ steps.seed.outputs.seeded }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # ⛔ THE SEED IS THE BINARY ALONE. A release archive ships its own `stdlib/`, and the compiler
      # resolves `stdlib/` by walking UP from its own executable — so an archive unpacked whole would
      # leave a RELEASED stdlib one directory above the seed and this checkout's own would never be
      # read. The build would succeed and compile the wrong library, silently.
      - name: Seed from the previous release
        id: seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ⛔ NO RELEASES AT ALL IS THE BOOTSTRAP CASE AND IS NOT A FAILURE. It happens exactly once,
          # for the first release, whose archives are built by hand — so it SKIPS with a notice rather
          # than going red. A red mark on the very release that introduces the workflow teaches people
          # to ignore red marks, which is the reason the tap job skips too.
          #
          # ⚠ It is NOT the same as "releases exist but none serves this target" — that IS a failure and
          # still errors below, because it means the chain broke somewhere it was supposed to hold.
          prev="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)"
          if [ -z "$prev" ]; then
            echo "::notice::no published release to seed from yet — v0.1.0's archives are built and published by hand (see this file's header)"
            echo "seeded=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "seeded=yes" >> "$GITHUB_OUTPUT"
          echo "seeding from $prev"
          work="$(mktemp -d)"
          gh release download "$prev" --pattern "*${{ matrix.target }}*" --dir "$work"
          archive="$(find "$work" -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | head -n1)"
          [ -n "$archive" ] || { echo "::error::$prev publishes no archive for ${{ matrix.target }}"; exit 1; }
          case "$archive" in
            *.zip)    unzip -q "$archive" -d "$work/x" ;;
            *.tar.gz) mkdir -p "$work/x" && tar -xzf "$archive" -C "$work/x" ;;
          esac
          mkdir -p .bootstrap
          found="$(find "$work/x" -type f -name 'maxon' -o -type f -name 'maxon.exe' | head -n1)"
          [ -n "$found" ] || { echo "::error::no maxon binary in $prev's ${{ matrix.target }} archive"; exit 1; }
          cp "$found" ".bootstrap/$(basename "$found")"
          chmod +x .bootstrap/*

      # ⛔ THE SEED IS RUN DIRECTLY, because the slot is empty on a fresh checkout and `maxon build`
      # needs a compiler before it can make one. `build.maxon` at the root says what gets built.
      - name: Build
        if: steps.seed.outputs.seeded == 'yes'
        run: |
          set -euo pipefail
          # ⚠ AN `if`, NOT `[ … ] && …`. Under `set -e` a trailing test that answers FALSE is the
          # step's exit status, so the non-Windows lanes would fail here having done nothing wrong.
          seed=".bootstrap/maxon"
          if [ -f "$seed.exe" ]; then
            seed="$seed.exe"
          fi
          # ⛔ THE OUTPUT IS NAMED EXPLICITLY, because the SEED is the previous release and may predate
          # named manifest targets. Such a seed reads `maxon-bin` as a PATH and writes the compiler to
          # its own default location — MEASURED: `maxon-bin/Profile/ProfileSampler`, after which the
          # suite step cannot find a compiler. `-o` is correct under both readings.
          "./$seed" build maxon-bin -o maxon-bin/.maxon/maxon

      # The suite runs inside --package, before the archive exists: a packaged compiler nobody ran is
      # a claim, and this is the step that makes it a fact.
      - name: Package (runs the suite first)
        if: steps.seed.outputs.seeded == 'yes'
        run: ./scripts/release.sh --package

      - uses: actions/upload-artifact@v4
        if: steps.seed.outputs.seeded == 'yes'
        with:
          name: maxon-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      # ⛔ A RED SUITE IS EXACTLY WHEN THE LOG IS WORTH HAVING, and it is the one case the upload above
      # never reaches. `release.sh` writes `dist/spec-test-<target>.log` and then FAILS the step, so
      # without this the only record of which cases went red dies with the runner.
      - name: Keep the suite log when it fails
        if: failure() && steps.seed.outputs.seeded == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: spec-test-log-${{ matrix.target }}
          path: dist/spec-test-*.log
          if-no-files-found: ignore

  # ⭐ THE MSI IS BUILT FROM THE PUBLISHED ARCHIVE, NOT FROM A SECOND BUILD OF THE TREE. It takes the
  # `x64-windows` job's own artifact, so the compiler inside the installer is byte-for-byte the one in
  # the zip beside it — two builds of the same commit would be two different files and nothing would
  # say which one a user had.
  msi:
    needs: [guard, package]
    if: needs.package.outputs.seeded == 'yes'
    runs-on: windows-latest
    # ⛔ OIDC, SO THERE IS NO SIGNING CREDENTIAL TO LEAK. GitHub mints a token for this one run and
    # Azure trades it for one through a federated credential scoped to this repository. Nothing that
    # would still work for someone who obtained it exists in a secret store, on a runner, or here.
    permissions:
      contents: read
      id-token: write
    # ⛔ THE FEDERATED CREDENTIAL IS SCOPED TO THIS ENVIRONMENT NAME, so the job cannot obtain a
    # signing token from anywhere else — not from a branch, not from a fork, not from a workflow that
    # merely asks for one. Azure checks the `environment:release` claim, so renaming this line revokes
    # signing rather than moving it.
    environment: release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: maxon-x64-windows
          path: dist

      # ⚠ PINNED — an installer should not change because a toolset released on a Tuesday.
      - name: Install WiX
        run: |
          set -euo pipefail
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE\\.dotnet\\tools" >> "$GITHUB_PATH"

      - name: Build the MSI
        run: ./installer/windows/build.sh

      # ⭐ SIGNING IS SWITCHED ON BY A REPOSITORY VARIABLE RATHER THAN BY EDITING THIS FILE, so a fork
      # — which has no Azure subscription and cannot be given one — still produces a release instead
      # of failing forever on a step it can never satisfy. `AZURE_SIGNING_ENDPOINT` is the switch.
      #
      # ⚠ THESE ARE `vars` AND NOT `secrets`, WHICH IS FORCED AS WELL AS CORRECT. A tenant, client and
      # subscription id are identifiers, not credentials — the credential is the OIDC token, minted per
      # run — and `secrets` is not a context `if:` can read, so gating on one is not expressible.
      - name: Azure login
        if: vars.AZURE_SIGNING_ENDPOINT != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SIGNING_SUBSCRIPTION_ID }}

      # Azure Artifact Signing, the service formerly called Trusted Signing. It mints a certificate
      # per request rather than handing one out, so there is no key on this runner and none to steal.
      - name: Sign the MSI
        if: vars.AZURE_SIGNING_ENDPOINT != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: The Maxon compiler
          description-url: https://maxon.dev

      # ⛔ THE SIGNATURE IS READ BACK OFF THE FILE, BECAUSE "THE SIGNING STEP EXITED 0" IS NOT THE SAME
      # QUESTION. A filter that matched nothing, a file signed after it was copied, a chain that does
      # not build on a stranger's machine — each leaves a green step and an unsigned installer, which
      # is the single outcome this whole apparatus exists to prevent.
      #
      # ⛔ AND THE TIMESTAMP IS CHECKED, NOT ASSUMED. Artifact Signing issues certificates that live
      # about THREE DAYS; a signature without a countersigned timestamp is verified against the
      # certificate's own validity window and is therefore broken by the weekend. An untimestamped
      # signature is worse than none — it looks right here and fails on a user's machine later.
      - name: Verify the signature
        if: vars.AZURE_SIGNING_ENDPOINT != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $found = @(Get-ChildItem dist -Filter *.msi)
          if ($found.Count -ne 1) { throw "expected one MSI in dist/, found $($found.Count)" }
          $msi = $found[0]
          $sig = Get-AuthenticodeSignature $msi.FullName
          Write-Host "$($msi.Name): $($sig.Status)"
          if ($sig.Status -ne 'Valid') {
            throw "$($msi.Name) is not validly signed: $($sig.Status) - $($sig.StatusMessage)"
          }
          if (-not $sig.TimeStamperCertificate) {
            throw "$($msi.Name) is signed but NOT timestamped, so the signature expires with a certificate that lives three days"
          }
          Write-Host "signer:    $($sig.SignerCertificate.Subject)"
          Write-Host "issuer:    $($sig.SignerCertificate.Issuer)"
          Write-Host "timestamp: $($sig.TimeStamperCertificate.Subject)"

      - name: Say that the installer is unsigned
        if: vars.AZURE_SIGNING_ENDPOINT == ''
        run: |
          echo "::warning title=Unsigned installer::AZURE_SIGNING_ENDPOINT is not set, so the MSI was not signed. SmartScreen will warn on first run, and winget submission validation may refuse it."

      - uses: actions/upload-artifact@v4
        with:
          name: maxon-msi
          path: dist/*.msi
          if-no-files-found: error

  publish:
    needs: [guard, package, msi]
    # ⛔ THE TAG IS THE ONLY THING THAT PUBLISHES. A release-branch run has reached this point having
    # built and tested everything, which is the whole point of rehearsing one — and stops here.
    if: needs.package.outputs.seeded == 'yes' && needs.guard.outputs.publish == 'yes'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staged

      - name: Collect the archives
        run: |
          set -euo pipefail
          mkdir -p dist
          find staged -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.msi' \) -exec cp {} dist/ \;
          ls -la dist/

      # ⛔ THE TAG AND THE BINARIES MUST NAME ONE VERSION. `release.sh --publish` refuses when the tag
      # disagrees with what the compiler reports, which is the check that keeps the MSI, the winget
      # manifest and the install page from naming different releases.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh --publish "${GITHUB_REF_NAME}"
