name: Feature or task
description: Work to be done — a language feature, a compiler change, a tool. Backlog items live here.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Proposing an idea rather than filing planned work?** Open it in
        [Ideas](https://github.com/maxon-lang/maxon/discussions/new?category=ideas) instead, where
        others can discuss and upvote it. This form is for work that is already agreed on and wants
        a place in the backlog.

  - type: textarea
    id: what
    attributes:
      label: What
      description: The change, in a few sentences. What the compiler does after it lands.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem it solves, or the measurement that motivated it.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done means
      description: >-
        How a reviewer knows it landed — the spec cases that go green, the fixture corpus, the
        number that moves, the doc that changes.
      placeholder: |
        - specs/<file>.md covers <cases>
        - `maxon-bin/.maxon/maxon spec-test` green
        - docs/optimization-log.md row recorded
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Files likely touched, prior art in the tree, anything that would otherwise be rediscovered.
    validations:
      required: false
