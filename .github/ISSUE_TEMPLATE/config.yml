blank_issues_enabled: true
contact_links:
  - name: Fix a bug (preferred)
    url: https://github.com/maxon-lang/maxon/blob/main/CONTRIBUTING.md#fix-a-bug
    about: We prefer a pull request to a bug report — an AI coding agent can usually turn a failing program into a fix.
  - name: Propose an idea
    url: https://github.com/maxon-lang/maxon/discussions/new?category=ideas
    about: A new feature or a change to an existing one — proposed in Ideas, where others can upvote it.
  - name: Questions
    url: https://github.com/maxon-lang/maxon/discussions
    about: How do I do X, is this a bug — Discussions is the place for anything not yet a report.
  - name: Documentation
    url: https://maxon.dev/docs
    about: The language reference, the standard library and the CLI.
