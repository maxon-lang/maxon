name: Feature request
description: Something the language or the toolchain should be able to do and cannot.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: >-
        The problem, before the solution. A feature is easier to judge — and often easier to grant a
        different way — when the thing it is for is written down.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: What it might look like
      description: Maxon code as you would want to write it, if you have a shape in mind.
      render: maxon
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: What you do instead today
      description: >-
        How you work around it now, and what that costs. A workaround that is merely verbose is a
        different case from one that is impossible.
    validations:
      required: false
