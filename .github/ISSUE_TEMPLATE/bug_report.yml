name: Bug report
description: The compiler did something wrong — a wrong answer, a crash, or a refusal of a correct program.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A compiler bug is worth reporting even if you cannot reduce it. A large program that
        misbehaves is a better report than no report.

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `maxon version` — it carries the version and the host target.
      placeholder: maxon 0.1.1 (a1b2c3d 2026-09-09) (x64-windows)
    validations:
      required: true

  - type: textarea
    id: program
    attributes:
      label: The program
      description: >-
        The smallest program that shows it, if you have one. Paste it directly — an attachment is
        harder to run.
      render: maxon
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
      description: >-
        Both halves matter. "It crashed" says less than "it should print 3 and exits 139", because the
        second says what the right answer was.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: The compiler's output
      description: The full output, including any error code (`E1234`). Not just the last line.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: kind
    attributes:
      label: What kind of wrong
      options:
        - The compiler rejected a program that should compile
        - The compiler accepted a program that should be rejected
        - The program compiled but ran wrongly
        - The compiler crashed or hung
        - Something else
    validations:
      required: true
